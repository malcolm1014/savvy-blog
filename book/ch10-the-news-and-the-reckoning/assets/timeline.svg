<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" font-family="'IBM Plex Mono', monospace" aria-label="A timeline, Forty Years of Reckonings, from 1988 to 2026, marking the incidents that changed security. 1988: the Morris Worm. 2010: Stuxnet. 2013: the Target breach and the Snowden disclosures. 2014: Heartbleed. 2015: the OPM breach. 2017: WannaCry, NotPetya, and Equifax. 2020: SolarWinds. 2021: Colonial Pipeline and Log4Shell. 2024: the XZ Utils backdoor, Change Healthcare, and Salt Typhoon. 2025 to 2026: the first AI-orchestrated campaigns. Nodes are colored by type: worm, state weapon, breach of trust, ransomware, supply chain, and AI.">
  <rect width="900" height="500" fill="#fbf8f0"/>
  <text x="40" y="44" font-size="22" font-weight="600" fill="#1a1712">Forty Years of Reckonings</text>
  <text x="40" y="68" font-size="12.5" fill="#5d5545">The incidents that taught us &mdash; each one a lesson the field paid for in full &middot; 1988&ndash;2026</text>

  <line x1="60" y1="250" x2="845" y2="250" stroke="#a86a22" stroke-width="3"/>
  <polygon points="845,250 833,244 833,256" fill="#a86a22"/>

  <g font-size="11" fill="#8a8275" text-anchor="middle">
    <text x="80" y="272">1988</text><text x="250" y="272">2010</text><text x="340" y="272">2014</text>
    <text x="470" y="272">2017</text><text x="580" y="272">2020&ndash;21</text><text x="730" y="272">2024</text><text x="835" y="272">2026</text>
  </g>

  <!-- above -->
  <g>
    <circle cx="80" cy="250" r="7" fill="#b23b2e"/><line x1="80" y1="243" x2="80" y2="150" stroke="#ddd6c4"/>
    <rect x="42" y="110" width="150" height="40" rx="5" fill="#f6eceb" stroke="#b23b2e"/>
    <text x="52" y="130" font-size="11.5" font-weight="700" fill="#1a1712">Morris Worm</text>
    <text x="52" y="144" font-size="10" fill="#5d5545">the internet&rsquo;s first</text>
  </g>
  <g>
    <circle cx="250" cy="250" r="7" fill="#7a3b8f"/><line x1="250" y1="243" x2="250" y2="150" stroke="#ddd6c4"/>
    <rect x="212" y="110" width="150" height="40" rx="5" fill="#f0eaf2" stroke="#7a3b8f"/>
    <text x="222" y="130" font-size="11.5" font-weight="700" fill="#1a1712">Stuxnet</text>
    <text x="222" y="144" font-size="10" fill="#5d5545">code breaks atoms</text>
  </g>
  <g>
    <circle cx="470" cy="250" r="7" fill="#c2601f"/><line x1="470" y1="243" x2="470" y2="140" stroke="#ddd6c4"/>
    <rect x="410" y="96" width="185" height="48" rx="5" fill="#f3ece0" stroke="#c2601f"/>
    <text x="420" y="114" font-size="11.5" font-weight="700" fill="#1a1712">WannaCry / NotPetya</text>
    <text x="420" y="128" font-size="10" fill="#5d5545">+ Equifax &mdash; the ransom</text>
    <text x="420" y="140" font-size="10" fill="#5d5545">era and the mega-breach</text>
  </g>
  <g>
    <circle cx="640" cy="250" r="7" fill="#2f6f4f"/><line x1="640" y1="243" x2="640" y2="150" stroke="#ddd6c4"/>
    <rect x="600" y="110" width="170" height="40" rx="5" fill="#eaf1ec" stroke="#2f6f4f"/>
    <text x="610" y="130" font-size="11.5" font-weight="700" fill="#1a1712">Log4Shell</text>
    <text x="610" y="144" font-size="10" fill="#5d5545">the supply-chain era</text>
  </g>
  <g>
    <circle cx="835" cy="250" r="7" fill="#1a1712"/><line x1="835" y1="243" x2="835" y2="175" stroke="#ddd6c4"/>
    <rect x="735" y="150" width="150" height="26" rx="5" fill="#fff" stroke="#1a1712"/>
    <text x="745" y="167" font-size="10.5" font-weight="700" fill="#1a1712">AI-orchestrated</text>
  </g>

  <!-- below -->
  <g>
    <circle cx="320" cy="250" r="7" fill="#2f6f4f"/><line x1="320" y1="257" x2="320" y2="320" stroke="#ddd6c4"/>
    <rect x="248" y="320" width="150" height="40" rx="5" fill="#eaf1ec" stroke="#2f6f4f"/>
    <text x="258" y="340" font-size="11.5" font-weight="700" fill="#1a1712">Heartbleed</text>
    <text x="258" y="354" font-size="10" fill="#5d5545">open source&rsquo;s reckoning</text>
  </g>
  <g>
    <circle cx="340" cy="250" r="6" fill="#c2601f"/>
    <text x="347" y="300" font-size="9.5" fill="#5d5545">2013&ndash;15: Target, Snowden, OPM</text>
    <line x1="340" y1="257" x2="340" y2="305" stroke="#ddd6c4"/>
  </g>
  <g>
    <circle cx="580" cy="250" r="7" fill="#7a3b8f"/><line x1="580" y1="257" x2="580" y2="320" stroke="#ddd6c4"/>
    <rect x="505" y="320" width="160" height="40" rx="5" fill="#f0eaf2" stroke="#7a3b8f"/>
    <text x="515" y="340" font-size="11.5" font-weight="700" fill="#1a1712">SolarWinds</text>
    <text x="515" y="354" font-size="10" fill="#5d5545">the trusted update</text>
  </g>
  <g>
    <circle cx="600" cy="250" r="6" fill="#c2601f"/>
    <text x="500" y="392" font-size="9.5" fill="#5d5545">2021: Colonial Pipeline &mdash; ransomware hits the pump</text>
    <line x1="600" y1="257" x2="600" y2="384" stroke="#ddd6c4"/>
  </g>
  <g>
    <circle cx="730" cy="250" r="7" fill="#2f6f4f"/><line x1="730" y1="257" x2="730" y2="320" stroke="#ddd6c4"/>
    <rect x="655" y="320" width="175" height="54" rx="5" fill="#eaf1ec" stroke="#2f6f4f"/>
    <text x="665" y="340" font-size="11.5" font-weight="700" fill="#1a1712">XZ Utils backdoor</text>
    <text x="665" y="354" font-size="10" fill="#5d5545">+ Change Healthcare,</text>
    <text x="665" y="366" font-size="10" fill="#5d5545">Salt Typhoon (China)</text>
  </g>

  <!-- legend -->
  <line x1="40" y1="432" x2="860" y2="432" stroke="#ddd6c4"/>
  <g font-size="10.5">
    <circle cx="52" cy="452" r="6" fill="#b23b2e"/><text x="63" y="456" fill="#5d5545">worm</text>
    <circle cx="140" cy="452" r="6" fill="#7a3b8f"/><text x="151" y="456" fill="#5d5545">state weapon</text>
    <circle cx="265" cy="452" r="6" fill="#c2601f"/><text x="276" y="456" fill="#5d5545">breach / ransomware</text>
    <circle cx="455" cy="452" r="6" fill="#2f6f4f"/><text x="466" y="456" fill="#5d5545">supply chain</text>
    <circle cx="590" cy="452" r="6" fill="#1a1712"/><text x="601" y="456" fill="#5d5545">AI</text>
  </g>
  <text x="40" y="482" font-size="10.5" fill="#8a8275">Diagram: Savvy Security LLC &middot; incidents and dates sourced in the text</text>
</svg>
