<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" font-family="'IBM Plex Mono', monospace" aria-label="A timeline, The Machines Learn to Hack, 2016 to 2026. 2016: DARPA Cyber Grand Challenge at DEF CON, Mayhem wins two million dollars, autonomous systems play capture the flag on stage. 2023: DARPA announces the AI Cyber Challenge. 2024: Google Big Sleep finds the first real-world zero-day discovered by an AI agent, in SQLite. June 2025: XBOW becomes the first autonomous system to reach number one on HackerOne's US leaderboard. August 2025: the AI Cyber Challenge final at DEF CON 33, Team Atlanta's ATLANTIS wins four million dollars, finalists find eighteen real zero-days. October 2025: Anthropic shows 250 poisoned documents can backdoor a model of any size. November 2025: Anthropic discloses GTG-1002, the first documented large-scale AI-orchestrated cyber-espionage campaign. 2026: agent task-horizons keep doubling, roughly every four months.">
  <rect width="900" height="500" fill="#fbf8f0"/>
  <text x="40" y="44" font-size="22" font-weight="600" fill="#1a1712">The Machines Learn to Hack</text>
  <text x="40" y="68" font-size="12.5" fill="#5d5545">From robots on a Las Vegas stage to autonomous agents on both sides of the line &#183; 2016&ndash;2026</text>

  <!-- central axis -->
  <line x1="60" y1="250" x2="840" y2="250" stroke="#a86a22" stroke-width="3"/>
  <polygon points="840,250 828,244 828,256" fill="#a86a22"/>

  <!-- tick helper years -->
  <g font-size="11" fill="#8a8275" text-anchor="middle">
    <text x="90" y="272">2016</text>
    <text x="300" y="272">2023</text>
    <text x="410" y="272">2024</text>
    <text x="610" y="272">2025</text>
    <text x="815" y="272">2026</text>
  </g>

  <!-- ===== ABOVE the axis ===== -->
  <!-- 2016 CGC -->
  <g>
    <circle cx="90" cy="250" r="7" fill="#b23b2e"/>
    <line x1="90" y1="243" x2="90" y2="150" stroke="#ddd6c4"/>
    <rect x="42" y="96" width="170" height="54" rx="5" fill="#f3ece0" stroke="#b23b2e"/>
    <text x="52" y="116" font-size="12" font-weight="700" fill="#1a1712">CGC &#183; DEF CON</text>
    <text x="52" y="132" font-size="10.5" fill="#5d5545">Mayhem wins $2M; bots</text>
    <text x="52" y="145" font-size="10.5" fill="#5d5545">play CTF autonomously</text>
  </g>

  <!-- 2024 Big Sleep -->
  <g>
    <circle cx="410" cy="250" r="7" fill="#2f6f4f"/>
    <line x1="410" y1="243" x2="410" y2="150" stroke="#ddd6c4"/>
    <rect x="340" y="96" width="185" height="54" rx="5" fill="#eaf1ec" stroke="#2f6f4f"/>
    <text x="350" y="116" font-size="12" font-weight="700" fill="#1a1712">Big Sleep (Google)</text>
    <text x="350" y="132" font-size="10.5" fill="#5d5545">first real 0-day found</text>
    <text x="350" y="145" font-size="10.5" fill="#5d5545">by an AI agent (SQLite)</text>
  </g>

  <!-- 2025 Aug AIxCC -->
  <g>
    <circle cx="610" cy="250" r="7" fill="#2f6f4f"/>
    <line x1="610" y1="243" x2="610" y2="150" stroke="#ddd6c4"/>
    <rect x="545" y="90" width="200" height="60" rx="5" fill="#eaf1ec" stroke="#2f6f4f"/>
    <text x="555" y="110" font-size="12" font-weight="700" fill="#1a1712">AIxCC FINAL &#183; Aug 2025</text>
    <text x="555" y="126" font-size="10.5" fill="#5d5545">Team Atlanta ATLANTIS,</text>
    <text x="555" y="139" font-size="10.5" fill="#5d5545">$4M; 18 real 0-days found</text>
  </g>

  <!-- ===== BELOW the axis ===== -->
  <!-- 2023 AIxCC announced -->
  <g>
    <circle cx="300" cy="250" r="7" fill="#a86a22"/>
    <line x1="300" y1="257" x2="300" y2="330" stroke="#ddd6c4"/>
    <rect x="232" y="330" width="175" height="40" rx="5" fill="#f3ece0" stroke="#a86a22"/>
    <text x="242" y="350" font-size="12" font-weight="700" fill="#1a1712">AIxCC announced</text>
    <text x="242" y="364" font-size="10.5" fill="#5d5545">DARPA, LLM era begins</text>
  </g>

  <!-- 2025 Jun XBOW -->
  <g>
    <circle cx="560" cy="250" r="7" fill="#b23b2e"/>
    <line x1="560" y1="257" x2="560" y2="330" stroke="#ddd6c4"/>
    <rect x="455" y="330" width="185" height="40" rx="5" fill="#f3ece0" stroke="#b23b2e"/>
    <text x="465" y="350" font-size="12" font-weight="700" fill="#1a1712">XBOW &#183; Jun 2025</text>
    <text x="465" y="364" font-size="10.5" fill="#5d5545">#1 on HackerOne (US)</text>
  </g>

  <!-- 2025 Nov GTG-1002 -->
  <g>
    <circle cx="660" cy="250" r="7" fill="#b23b2e"/>
    <line x1="660" y1="257" x2="660" y2="388" stroke="#ddd6c4"/>
    <rect x="560" y="388" width="230" height="54" rx="5" fill="#f6eceb" stroke="#b23b2e"/>
    <text x="570" y="408" font-size="12" font-weight="700" fill="#1a1712">GTG-1002 &#183; Nov 2025</text>
    <text x="570" y="424" font-size="10.5" fill="#5d5545">first large-scale AI-orchestrated</text>
    <text x="570" y="437" font-size="10.5" fill="#5d5545">espionage (~80&ndash;90% autonomous)</text>
  </g>

  <!-- 2025 Oct poison -->
  <g>
    <circle cx="630" cy="250" r="6" fill="#a86a22"/>
    <line x1="630" y1="257" x2="630" y2="300" stroke="#ddd6c4"/>
    <text x="636" y="296" font-size="10" fill="#5d5545">Oct 2025: 250 docs poison any model</text>
  </g>

  <!-- 2026 present -->
  <g>
    <circle cx="815" cy="250" r="7" fill="#1a1712"/>
    <line x1="815" y1="243" x2="815" y2="185" stroke="#ddd6c4"/>
    <rect x="735" y="150" width="150" height="36" rx="5" fill="#fff" stroke="#1a1712"/>
    <text x="745" y="166" font-size="11.5" font-weight="700" fill="#1a1712">2026 &#183; now</text>
    <text x="745" y="179" font-size="10" fill="#5d5545">horizons still doubling</text>
  </g>

  <!-- legend -->
  <line x1="40" y1="462" x2="860" y2="462" stroke="#ddd6c4"/>
  <g font-size="11">
    <circle cx="52" cy="480" r="6" fill="#2f6f4f"/><text x="64" y="484" fill="#5d5545">defense milestone</text>
    <circle cx="210" cy="480" r="6" fill="#b23b2e"/><text x="222" y="484" fill="#5d5545">offense / incident</text>
    <circle cx="375" cy="480" r="6" fill="#a86a22"/><text x="387" y="484" fill="#5d5545">infrastructure / milestone</text>
    <text x="620" y="484" fill="#8a8275">Diagram: Savvy Security LLC &#183; sourced in text</text>
  </g>
</svg>
