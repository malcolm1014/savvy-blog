<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="A Hacker's Guide to Survive — Savvy Security LLC, Edition One, 2026. A dark terminal with a green prompt and a rising ember-colored flame.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e13"/>
      <stop offset="1" stop-color="#11130f"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#a86a22"/>
      <stop offset="0.55" stop-color="#e0a256"/>
      <stop offset="1" stop-color="#f6d08a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#e0a256" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e0a256" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- faint scanlines -->
  <g opacity="0.05" fill="#4ade80">
    <rect x="0" y="0" width="1200" height="2"/><rect x="0" y="40" width="1200" height="2"/>
    <rect x="0" y="80" width="1200" height="2"/><rect x="0" y="120" width="1200" height="2"/>
    <rect x="0" y="160" width="1200" height="2"/><rect x="0" y="200" width="1200" height="2"/>
    <rect x="0" y="240" width="1200" height="2"/><rect x="0" y="280" width="1200" height="2"/>
    <rect x="0" y="320" width="1200" height="2"/><rect x="0" y="360" width="1200" height="2"/>
    <rect x="0" y="400" width="1200" height="2"/><rect x="0" y="440" width="1200" height="2"/>
    <rect x="0" y="480" width="1200" height="2"/><rect x="0" y="520" width="1200" height="2"/>
    <rect x="0" y="560" width="1200" height="2"/><rect x="0" y="600" width="1200" height="2"/>
  </g>

  <!-- the fire: a stylized flame rising from a prompt -->
  <g transform="translate(600,430)">
    <path d="M0,-150 C 45,-105 52,-66 30,-30 C 70,-54 70,-100 50,-140 C 96,-96 104,-30 70,12 C 100,-6 112,-40 110,-70 C 132,-18 108,46 44,70 C 70,54 80,26 70,2 C 56,36 20,44 6,40 C -30,52 -84,30 -96,-18 C -84,8 -58,20 -36,14 C -70,-14 -70,-66 -34,-98 C -46,-62 -34,-34 -8,-26 C -34,-66 -24,-120 0,-150 Z" fill="url(#flame)" opacity="0.92"/>
  </g>

  <!-- terminal prompt -->
  <text x="100" y="140" font-family="'IBM Plex Mono', monospace" font-size="30" fill="#4ade80">root@savvy:~#</text>
  <text x="396" y="140" font-family="'IBM Plex Mono', monospace" font-size="30" fill="#e8e5d8">./survive --edition 1</text>
  <rect x="690" y="116" width="16" height="30" fill="#4ade80"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>

  <!-- title -->
  <text x="100" y="470" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="92" fill="#f6f3ea">A Hacker&#8217;s</text>
  <text x="100" y="558" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="92" fill="#f6f3ea">Guide to <tspan fill="#e0a256">Survive</tspan></text>

  <!-- footer line -->
  <text x="100" y="604" font-family="'IBM Plex Mono', monospace" font-size="21" fill="#a49c87" letter-spacing="2">SAVVY SECURITY LLC &#183; A LIVING COMPENDIUM &#183; EDITION ONE &#183; 2026</text>
</svg>
