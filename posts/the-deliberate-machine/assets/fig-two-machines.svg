<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">
  <rect width="1000" height="540" fill="#0d1410"/>
  <rect x="0.5" y="0.5" width="999" height="539" fill="none" stroke="#2c2e24"/>

  <!-- divider -->
  <line x1="500" y1="40" x2="500" y2="500" stroke="#2c2e24" stroke-dasharray="4 6"/>

  <!-- LEFT: the fast machine -->
  <text x="60" y="60" fill="#e0a256" font-size="15" font-weight="700" letter-spacing="1.5">THE FAST MACHINE</text>
  <text x="60" y="82" fill="#a49c87" font-size="12.5">reflex &#183; one pass &#183; answers now</text>

  <rect x="60" y="120" width="150" height="54" rx="6" fill="#161b15" stroke="#3a3f30"/>
  <text x="135" y="152" fill="#e8e5d8" font-size="13" text-anchor="middle">question</text>

  <line x1="210" y1="147" x2="300" y2="147" stroke="#d65a48" stroke-width="3" marker-end="url(#rh)"/>

  <rect x="300" y="120" width="140" height="54" rx="6" fill="#2a1512" stroke="#d65a48"/>
  <text x="370" y="144" fill="#f0b9ac" font-size="12.5" text-anchor="middle">single model</text>
  <text x="370" y="162" fill="#f0b9ac" font-size="12.5" text-anchor="middle">best guess</text>

  <line x1="370" y1="174" x2="370" y2="250" stroke="#d65a48" stroke-width="3" marker-end="url(#rh)"/>

  <rect x="285" y="250" width="170" height="86" rx="6" fill="#161b15" stroke="#d65a48"/>
  <text x="370" y="282" fill="#f0b9ac" font-size="26" font-weight="700" text-anchor="middle">&#8220;Yes.&#8221;</text>
  <text x="370" y="312" fill="#a49c87" font-size="12" text-anchor="middle">confident</text>
  <text x="370" y="328" fill="#d65a48" font-size="12" text-anchor="middle">&#8212; and sometimes wrong</text>

  <text x="60" y="400" fill="#a49c87" font-size="12.5">Stated certainty barely tracks accuracy.</text>
  <text x="60" y="420" fill="#a49c87" font-size="12.5">The confidence signal is close to a</text>
  <text x="60" y="440" fill="#a49c87" font-size="12.5">coin flip (~63% AUROC).</text>
  <rect x="60" y="462" width="380" height="2" fill="#d65a48"/>

  <!-- RIGHT: the deliberate machine -->
  <text x="545" y="60" fill="#7fa6c2" font-size="15" font-weight="700" letter-spacing="1.5">THE DELIBERATE MACHINE</text>
  <text x="545" y="82" fill="#a49c87" font-size="12.5">branch &#183; score &#183; challenge &#183; then commit</text>

  <rect x="545" y="112" width="120" height="44" rx="6" fill="#161b15" stroke="#3a3f30"/>
  <text x="605" y="139" fill="#e8e5d8" font-size="12.5" text-anchor="middle">question</text>

  <!-- three trees -->
  <g stroke="#7fa6c2" stroke-width="2.5" fill="none">
    <path d="M665 134 C 720 134, 720 190, 775 190"/>
    <path d="M665 134 C 720 134, 720 234, 775 234"/>
    <path d="M665 134 C 720 134, 720 278, 775 278"/>
  </g>
  <g font-size="11.5">
    <rect x="775" y="172" width="165" height="36" rx="5" fill="#13212c" stroke="#7fa6c2"/>
    <text x="857" y="195" fill="#bcd3e2" text-anchor="middle">scorer A &#183; citations</text>
    <rect x="775" y="216" width="165" height="36" rx="5" fill="#13212c" stroke="#7fa6c2"/>
    <text x="857" y="239" fill="#bcd3e2" text-anchor="middle">scorer B &#183; recency</text>
    <rect x="775" y="260" width="165" height="36" rx="5" fill="#13212c" stroke="#7fa6c2"/>
    <text x="857" y="283" fill="#bcd3e2" text-anchor="middle">scorer C &#183; venue</text>
  </g>

  <!-- converge to consensus -->
  <g stroke="#7fa6c2" stroke-width="2.5" fill="none">
    <path d="M775 190 C 730 190, 730 330, 690 330"/>
    <path d="M775 234 C 745 234, 745 330, 690 330"/>
    <path d="M775 278 C 730 278, 730 330, 690 330"/>
  </g>

  <rect x="545" y="308" width="145" height="48" rx="6" fill="#161b15" stroke="#e0a256"/>
  <text x="617" y="330" fill="#e0a256" font-size="12.5" text-anchor="middle" font-weight="700">consensus</text>
  <text x="617" y="347" fill="#a49c87" font-size="11" text-anchor="middle">+ adversary veto</text>

  <!-- two outcomes -->
  <line x1="617" y1="356" x2="617" y2="384" stroke="#e0a256" stroke-width="2.5"/>
  <line x1="617" y1="384" x2="560" y2="384" stroke="#4ade80" stroke-width="2.5"/>
  <line x1="560" y1="384" x2="560" y2="402" stroke="#4ade80" stroke-width="2.5" marker-end="url(#gh)"/>
  <line x1="617" y1="384" x2="690" y2="384" stroke="#e0a256" stroke-width="2.5"/>
  <line x1="690" y1="384" x2="690" y2="402" stroke="#e0a256" stroke-width="2.5" marker-end="url(#ah)"/>

  <rect x="490" y="408" width="140" height="54" rx="6" fill="#13261a" stroke="#4ade80"/>
  <text x="560" y="432" fill="#86efac" font-size="12.5" text-anchor="middle">strong &amp; clear</text>
  <text x="560" y="450" fill="#86efac" font-size="12.5" text-anchor="middle">&#8594; answer</text>

  <rect x="648" y="408" width="150" height="54" rx="6" fill="#2a2212" stroke="#e0a256"/>
  <text x="723" y="432" fill="#f0c488" font-size="12.5" text-anchor="middle">thin / contested</text>
  <text x="723" y="450" fill="#f0c488" font-size="12.5" text-anchor="middle">&#8594; ask a human</text>

  <text x="545" y="500" fill="#a49c87" font-size="12">It knows when it does not know.</text>

  <defs>
    <marker id="rh" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8z" fill="#d65a48"/></marker>
    <marker id="gh" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8z" fill="#4ade80"/></marker>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8z" fill="#e0a256"/></marker>
  </defs>
</svg>
