<text x="450" y="334" text-anchor="middle" font-size="12" font-weight="700" fill="#f08c7a">AT ITS LOWEST, MORE THAN 80% OF SERVERS UNRESPONSIVE</text>
<line x1="450" y1="350" x2="450" y2="386" stroke="#a49c87" stroke-width="2" marker-end="url(#ar)"/>
<rect x="60" y="392" width="116" height="34" rx="4" fill="#141a14" stroke="#5d5545" stroke-width="1.5"/>
<text x="118" y="414" text-anchor="middle" font-size="11.5" fill="#e8e5d8">EXCHANGE</text>
<rect x="194" y="392" width="116" height="34" rx="4" fill="#141a14" stroke="#5d5545" stroke-width="1.5"/>
<text x="252" y="414" text-anchor="middle" font-size="11.5" fill="#e8e5d8">TEAMS</text>
<rect x="328" y="392" width="116" height="34" rx="4" fill="#141a14" stroke="#5d5545" stroke-width="1.5"/>
<text x="386" y="414" text-anchor="middle" font-size="11.5" fill="#e8e5d8">SHAREPOINT</text>
<rect x="462" y="392" width="116" height="34" rx="4" fill="#141a14" stroke="#5d5545" stroke-width="1.5"/>
<text x="520" y="414" text-anchor="middle" font-size="11.5" fill="#e8e5d8">ONEDRIVE</text>
<rect x="596" y="392" width="116" height="34" rx="4" fill="#141a14" stroke="#5d5545" stroke-width="1.5"/>
<text x="654" y="414" text-anchor="middle" font-size="11.5" fill="#e8e5d8">COPILOT</text>
<rect x="730" y="392" width="116" height="34" rx="4" fill="#141a14" stroke="#5d5545" stroke-width="1.5"/>
<text x="788" y="414" text-anchor="middle" font-size="11.5" fill="#e8e5d8">+ 9 MORE</text>
<text x="450" y="452" text-anchor="middle" font-size="11.5" fill="#a49c87">Bulkheads between server partitions did not stop the cascade, "due to a separate issue."</text>
<text x="30" y="485" font-size="10.5" fill="#7d7363">Source: Microsoft, Preliminary Post Incident Report EX1550543 / MO1550821, November 15, 2026.</text>
