<rect x="478" y="290" width="14" height="22" rx="2" fill="#141a14" stroke="#86efac" stroke-width="1.5"/>
<rect x="498" y="290" width="14" height="22" rx="2" fill="#2a1512" stroke="#f08c7a" stroke-width="1.5"/>
<rect x="518" y="290" width="14" height="22" rx="2" fill="#2a1512" stroke="#f08c7a" stroke-width="1.5"/>
<rect x="538" y="290" width="14" height="22" rx="2" fill="#2a1512" stroke="#f08c7a" stroke-width="1.5"/>
