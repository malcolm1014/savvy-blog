<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111c33"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="990" cy="150" r="380" fill="url(#glow)"/>

  <!-- blueprint grid, right third -->
  <g stroke="#f59e0b" stroke-width="1" opacity="0.14">
    <line x1="860" y1="0" x2="860" y2="630"/>
    <line x1="940" y1="0" x2="940" y2="630"/>
    <line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="1180" y1="0" x2="1180" y2="630"/>
    <line x1="800" y1="80" x2="1200" y2="80"/>
    <line x1="800" y1="200" x2="1200" y2="200"/>
    <line x1="800" y1="320" x2="1200" y2="320"/>
    <line x1="800" y1="440" x2="1200" y2="440"/>
    <line x1="800" y1="560" x2="1200" y2="560"/>
  </g>

  <!-- the long way in: a winding, dotted route from a desk to a federal seal -->
  <g fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round" opacity="0.9">
    <path d="M 848 560 C 900 540, 900 480, 950 460 S 1030 420, 1010 370 S 930 330, 950 280 S 1050 240, 1080 180"/>
  </g>

  <!-- waypoint nodes along the route -->
  <circle cx="848" cy="560" r="7" fill="#fbbf24"/>
  <circle cx="950" cy="460" r="5.5" fill="#f59e0b" opacity="0.9"/>
  <circle cx="1010" cy="370" r="5.5" fill="#f59e0b" opacity="0.9"/>
  <circle cx="950" cy="280" r="5.5" fill="#f59e0b" opacity="0.9"/>

  <!-- endpoint: a plain 5-point star, federal marker -->
  <g transform="translate(1080,180)">
    <path d="M0,-19 L4.6,-6.5 L18,-6.5 L7.4,1.7 L11.4,15 L0,7 L-11.4,15 L-7.4,1.7 L-18,-6.5 L-4.6,-6.5 Z"
          fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  </g>

  <!-- small labels at the two ends -->
  <text x="848" y="590" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8" letter-spacing="1.2" text-anchor="middle">A TEXT EDITOR</text>
  <text x="1080" y="140" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fbbf24" letter-spacing="1.2" text-anchor="middle">DARPA D2P2</text>

  <text x="1000" y="622" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#fbbf24" letter-spacing="1.5" text-anchor="middle" opacity="0.85">FOURTEEN MONTHS, ONE SEQUENCE</text>

  <!-- eyebrow -->
  <text x="80" y="120" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#fbbf24" letter-spacing="3" font-weight="600">SAVVY SECURITY LLC</text>

  <!-- title -->
  <text x="78" y="215" font-family="Georgia, 'Times New Roman', serif" font-size="66" fill="#f8fafc" font-weight="700">The Long Way In</text>

  <!-- subtitle -->
  <text x="80" y="266" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#94a3b8" font-weight="400">Fourteen months from a text editor to a DARPA proposal</text>

  <!-- byline -->
  <text x="80" y="336" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#64748b">By Malcolm Smith · Savvy Security LLC</text>
</svg>
