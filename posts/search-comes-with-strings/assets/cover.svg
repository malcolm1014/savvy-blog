<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="76%" cy="48%" r="62%">
      <stop offset="0" stop-color="#16263a"/><stop offset="1" stop-color="#0b0f14"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#18212c" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity=".75"/>

  <!-- school building -->
  <g transform="translate(820,360)">
    <polygon points="-150,0 0,-90 150,0" fill="#1b2a3a" stroke="#7fa6c2" stroke-width="3"/>
    <rect x="-130" y="0" width="260" height="150" fill="#132030" stroke="#7fa6c2" stroke-width="3"/>
    <circle cx="0" cy="-35" r="20" fill="none" stroke="#e0a256" stroke-width="3"/>
    <line x1="0" y1="-35" x2="0" y2="-48" stroke="#e0a256" stroke-width="3"/>
    <line x1="0" y1="-35" x2="10" y2="-35" stroke="#e0a256" stroke-width="3"/>
    <g fill="#0b0f14" stroke="#7fa6c2" stroke-width="2">
      <rect x="-110" y="25" width="40" height="40"/><rect x="-50" y="25" width="40" height="40"/>
      <rect x="10" y="25" width="40" height="40"/><rect x="70" y="25" width="40" height="40"/>
      <rect x="-22" y="90" width="44" height="60"/>
    </g>
  </g>

  <!-- search bar, chained -->
  <g transform="translate(672,92)">
    <rect width="348" height="64" rx="32" fill="#efe9da"/>
    <circle cx="40" cy="30" r="14" fill="none" stroke="#2f5568" stroke-width="4"/>
    <line x1="50" y1="41" x2="62" y2="53" stroke="#2f5568" stroke-width="5" stroke-linecap="round"/>
    <text x="84" y="41" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#5d5545">search the web…</text>
  </g>
  <!-- AI sparkle tag -->
  <g transform="translate(1080,124)">
    <path d="M0,-34 C6,-8 8,-6 34,0 C8,6 6,8 0,34 C-6,8 -8,6 -34,0 C-8,-6 -6,-8 0,-34Z" fill="#e0a256"/>
    <text x="0" y="64" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="700" fill="#e0a256">AI</text>
  </g>
  <!-- chain links between search bar and AI -->
  <g fill="none" stroke="#c9c0aa" stroke-width="5">
    <ellipse cx="1032" cy="124" rx="13" ry="7"/>
    <ellipse cx="1050" cy="124" rx="13" ry="7"/>
  </g>
  <!-- strings down to the school -->
  <g stroke="#e0a256" stroke-width="2" stroke-dasharray="6 7" fill="none" opacity=".85">
    <path d="M700 156 C 700 210, 720 230, 730 280"/>
    <path d="M830 156 C 830 200, 820 230, 820 268"/>
    <path d="M960 156 C 960 210, 920 230, 910 280"/>
  </g>
  <text x="820" y="560" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="700" letter-spacing="2" fill="#7fa6c2">K-12 STUDENT ACCOUNTS</text>

  <!-- text block -->
  <text x="60" y="92" font-family="DejaVu Sans Mono, monospace" font-size="18" letter-spacing="3" fill="#e0a256" font-weight="700">SAVVY SECURITY LLC · RESEARCH</text>
  <text x="60" y="186" font-family="DejaVu Serif, serif" font-size="72" font-weight="700" fill="#efe9da">Search Comes</text>
  <text x="60" y="268" font-family="DejaVu Serif, serif" font-size="72" font-weight="700" fill="#e0a256">With Strings</text>
  <text x="62" y="334" font-family="DejaVu Serif, serif" font-size="26" font-style="italic" fill="#c9c0aa">Google lets schools switch off its AI.</text>
  <text x="62" y="370" font-family="DejaVu Serif, serif" font-size="26" font-style="italic" fill="#c9c0aa">It doesn't let them keep Search</text>
  <text x="62" y="406" font-family="DejaVu Serif, serif" font-size="26" font-style="italic" fill="#c9c0aa">without it. What the research says.</text>
  <rect x="62" y="466" width="420" height="2" fill="#e0a256"/>
  <text x="62" y="508" font-family="DejaVu Sans Mono, monospace" font-size="19" fill="#a49c87">By Malcolm R. Smith</text>
  <text x="62" y="540" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#7d7363">malcolm1014.github.io/savvy-blog</text>
</svg>
