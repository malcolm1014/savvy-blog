<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="DejaVu Sans, sans-serif">
  <rect width="1000" height="470" fill="#fbf8f0"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#1a1712">How we got here</text>
  <text x="40" y="76" font-size="15" fill="#5d5545">From a default-on chatbot tab to a default-off switchboard in under three months</text>
  <line x1="60" y1="240" x2="950" y2="240" stroke="#2f5568" stroke-width="4"/>
  <g font-size="14">
    <!-- 1 -->
    <circle cx="100" cy="240" r="11" fill="#a86a22"/>
    <text x="100" y="140" text-anchor="middle" font-weight="700" fill="#a86a22" font-family="DejaVu Sans Mono, monospace">AUG 10</text>
    <text x="100" y="162" text-anchor="middle" fill="#1a1712">Gemini tab appears</text>
    <text x="100" y="180" text-anchor="middle" fill="#1a1712">by default in Classroom</text>
    <text x="100" y="198" text-anchor="middle" fill="#5d5545">for eligible K-12 students</text>
    <!-- 2 -->
    <circle cx="300" cy="240" r="11" fill="#a86a22"/>
    <text x="300" y="300" text-anchor="middle" font-weight="700" fill="#a86a22" font-family="DejaVu Sans Mono, monospace">SEPTEMBER</text>
    <text x="300" y="322" text-anchor="middle" fill="#1a1712">NYC and Los Angeles</text>
    <text x="300" y="340" text-anchor="middle" fill="#1a1712">restrict student gen-AI</text>
    <text x="300" y="358" text-anchor="middle" fill="#5d5545">in elementary and middle school</text>
    <!-- 3 -->
    <circle cx="500" cy="240" r="14" fill="#c0574a"/>
    <text x="500" y="140" text-anchor="middle" font-weight="700" fill="#c0574a" font-family="DejaVu Sans Mono, monospace">NOV 3</text>
    <text x="500" y="162" text-anchor="middle" fill="#1a1712">AI and Search off by default;</text>
    <text x="500" y="180" text-anchor="middle" fill="#1a1712">reported: ban AI, lose Search</text>
    <text x="500" y="198" text-anchor="middle" fill="#5d5545">Backlash within hours</text>
    <!-- 4 -->
    <circle cx="700" cy="240" r="11" fill="#2f5568"/>
    <text x="700" y="300" text-anchor="middle" font-weight="700" fill="#2f5568" font-family="DejaVu Sans Mono, monospace">NOV 3 · HOURS LATER</text>
    <text x="700" y="322" text-anchor="middle" fill="#1a1712">Google: Gemini and Search</text>
    <text x="700" y="340" text-anchor="middle" fill="#1a1712">are "separate controls"</text>
    <text x="700" y="358" text-anchor="middle" fill="#5d5545">but Search keeps its AI</text>
    <!-- 5 -->
    <circle cx="900" cy="240" r="11" fill="none" stroke="#2f5568" stroke-width="4"/>
    <text x="900" y="140" text-anchor="middle" font-weight="700" fill="#2f5568" font-family="DejaVu Sans Mono, monospace">EARLY 2027</text>
    <text x="900" y="162" text-anchor="middle" fill="#1a1712">New controls roll out;</text>
    <text x="900" y="180" text-anchor="middle" fill="#1a1712">admins must opt in</text>
    <text x="900" y="198" text-anchor="middle" fill="#5d5545">to each service</text>
  </g>
  <text x="40" y="440" font-size="12" fill="#7d7363" font-family="DejaVu Sans Mono, monospace">Sources: eWeek, AP, GovTech, Education Week, Dexerto (all 2026). Dates are 2026 unless noted.</text>
</svg>
