<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">
  <rect width="1200" height="640" fill="#f6f3ea"/>
  <text x="40" y="46" font-family="'Source Serif 4','DejaVu Serif',serif" font-size="26" font-weight="700" fill="#1a1712">The November 2026 outage wave, Nov 12&#8211;17</text>
  <text x="40" y="74" font-size="14" fill="#5d5545">Bars show reported windows where start and end were published. Dots: day only, duration as reported.</text>
  <!-- day columns: x0=300, 140px per day, Nov12..Nov17 -->
  <g font-size="14" fill="#5d5545" text-anchor="middle">
    <text x="370" y="112">Thu 12</text><text x="510" y="112">Fri 13</text><text x="650" y="112">Sat 14</text>
    <text x="790" y="112">Sun 15</text><text x="930" y="112">Mon 16</text><text x="1070" y="112">Tue 17</text>
  </g>
  <g stroke="#ddd6c4" stroke-width="1.5">
    <line x1="300" y1="124" x2="300" y2="560"/><line x1="440" y1="124" x2="440" y2="560"/><line x1="580" y1="124" x2="580" y2="560"/>
    <line x1="720" y1="124" x2="720" y2="560"/><line x1="860" y1="124" x2="860" y2="560"/><line x1="1000" y1="124" x2="1000" y2="560"/><line x1="1140" y1="124" x2="1140" y2="560"/>
  </g>
  <!-- rows (y step 48), UTC positioning: x = 300 + 140*(day + hour/24) -->
  <g font-size="15" fill="#1a1712" font-weight="600">
    <text x="40" y="160">Microsoft 365</text><text x="40" y="208">FAA ground stop</text><text x="40" y="256">Workday</text>
    <text x="40" y="304">AWS us-east-1</text><text x="40" y="352">JPMorgan Chase</text><text x="40" y="400">United Airlines</text>
    <text x="40" y="448">Apple services</text><text x="40" y="496">NSA Net</text><text x="40" y="544">Equinor</text>
  </g>
  <!-- MS: Nov12 16:20 -> Nov13 16:10 UTC -->
  <rect x="395" y="145" width="139" height="20" rx="3" fill="#b23a2a"/>
  <text x="542" y="160" font-size="13" fill="#5d5545">23 h 50 m</text>
  <!-- FAA: Nov13 20:53 -> Nov14 01:15 UTC -->
  <rect x="562" y="193" width="26" height="20" rx="3" fill="#b23a2a"/>
  <text x="596" y="208" font-size="13" fill="#5d5545">4 h 21 m &#183; 17 of 22 ARTCCs</text>
  <!-- Workday: Nov13-14, ~18h, no published window -->
  <circle cx="510" cy="250" r="8" fill="#b23a2a"/><text x="526" y="256" font-size="13" fill="#5d5545">~18 h, two data centers</text>
  <!-- AWS: Nov15 11:05 -> 14:21 UTC -->
  <rect x="785" y="289" width="19" height="20" rx="3" fill="#b23a2a"/>
  <text x="812" y="304" font-size="13" fill="#5d5545">~3 h 16 m &#183; cause not given</text>
  <circle cx="930" cy="346" r="8" fill="#b23a2a"/><text x="946" y="352" font-size="13" fill="#5d5545">~8.6 h</text>
  <circle cx="930" cy="394" r="8" fill="#b23a2a"/><text x="946" y="400" font-size="13" fill="#5d5545">~1.5 h</text>
  <circle cx="1070" cy="442" r="8" fill="#b23a2a"/><text x="1050" y="448" font-size="13" fill="#5d5545" text-anchor="end">internal update</text>
  <circle cx="1070" cy="490" r="8" fill="#a86a22"/><text x="1050" y="496" font-size="13" fill="#5d5545" text-anchor="end">scheduled maintenance</text>
  <rect x="1062" y="530" width="16" height="16" fill="#1a1712" transform="rotate(45 1070 538)"/><text x="1050" y="544" font-size="13" fill="#5d5545" text-anchor="end">confirmed cyberattack</text>
  <!-- legend -->
  <g font-size="13" fill="#1a1712">
    <rect x="40" y="590" width="16" height="16" rx="3" fill="#b23a2a"/><text x="64" y="603">technical fault / bad change</text>
    <circle cx="358" cy="598" r="8" fill="#a86a22"/><text x="374" y="603">maintenance</text>
    <rect x="530" y="590" width="14" height="14" fill="#1a1712" transform="rotate(45 537 597)"/><text x="556" y="603">attack</text>
    <text x="1160" y="603" text-anchor="end" fill="#5d5545">Savvy Security LLC &#183; sources in article</text>
  </g>
</svg>
