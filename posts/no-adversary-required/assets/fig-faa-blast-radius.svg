<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">
  <rect width="1200" height="600" fill="#f6f3ea"/>
  <text x="40" y="46" font-family="'Source Serif 4','DejaVu Serif',serif" font-size="26" font-weight="700" fill="#1a1712">One edge change, a national blast radius</text>
  <text x="40" y="74" font-size="14" fill="#5d5545">FAA Telecommunications Infrastructure (FTI), November 13, 2026, as described by the FAA and DOT. Simplified.</text>
  <!-- edge sites -->
  <g font-size="13">
    <rect x="40" y="150" width="230" height="86" rx="6" fill="#2a110d" stroke="#f08c7a" stroke-width="2"/>
    <text x="155" y="178" text-anchor="middle" fill="#f3c6bd" font-weight="700">EL DORADO, AR</text>
    <text x="155" y="198" text-anchor="middle" fill="#f3c6bd">radio site &#183; new router</text>
    <text x="155" y="218" text-anchor="middle" fill="#f3c6bd">copper &#8594; fiber cutover</text>
    <rect x="40" y="300" width="230" height="86" rx="6" fill="#2a110d" stroke="#f08c7a" stroke-width="2"/>
    <text x="155" y="328" text-anchor="middle" fill="#f3c6bd" font-weight="700">AMARILLO, TX</text>
    <text x="155" y="348" text-anchor="middle" fill="#f3c6bd">radar site &#183; router</text>
    <text x="155" y="368" text-anchor="middle" fill="#f3c6bd">installed ~3 weeks earlier</text>
  </g>
  <!-- flood arrows -->
  <g stroke="#b23a2a" stroke-width="4" fill="none">
    <path d="M270 193 C 350 193, 360 260, 440 262"/><path d="M270 343 C 350 343, 360 280, 440 278"/>
  </g>
  <polygon points="440,252 458,270 440,288" fill="#b23a2a"/>
  <text x="300" y="128" font-size="13" fill="#b23a2a" font-weight="700">FLOOD: ~1,000 connection</text>
  <text x="300" y="146" font-size="13" fill="#b23a2a" font-weight="700">attempts every 4&#8211;5 seconds</text>
  <!-- backbone -->
  <rect x="460" y="200" width="250" height="140" rx="10" fill="#fbf8f0" stroke="#2f5568" stroke-width="3"/>
  <text x="585" y="245" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5568">FTI BACKBONE</text>
  <text x="585" y="270" text-anchor="middle" font-size="13" fill="#5d5545">legacy switches and</text>
  <text x="585" y="290" text-anchor="middle" font-size="13" fill="#5d5545">routers become unstable</text>
  <text x="585" y="316" text-anchor="middle" font-size="12" fill="#5d5545">(contractor-run: L3Harris)</text>
  <!-- ARTCC grid 22 -->
  <g>
    <rect x="790" y="150" width="48" height="48" rx="5" fill="#b23a2a" opacity="0.92"/>
<rect x="852" y="150" width="48" height="48" rx="5" fill="#b23a2a" opacity="0.92"/>
<rect x="914" y="150" width="48" height="48" rx="5" fill="#b23a2a" opacity="0.92"/>
<rect x="976" y="150" width="48" height="48" rx="5" fill="#2f5568" opacity="0.85"/>
<rect x="1038" y="150" width="48" height="48" rx="5" fill="#b23a2a" opacity="0.92"/>
<rect x="1100" y="150" width="48" height="48" rx="5" fill="#b23a2a" opacity="0.92"/>
<rect x="790" y="212" width="48" height="48" rx="5" fill="#b23a2a" opacity="0.92"/>
<rect x="852" y="212" width="48" height="48" rx="5" fill="#b23a2a" opacity="0.92"/>
<rect x="914" y="212" width="48" height="48" rx="5" fill="#2f5568" opacity="0.85"/>
<rect x="976" y="212" width="48" height="48" rx="5" fill="#b23a2a" opacity="0.92"/>
<rect x="1038" y="212" width="48" height="48" rx="5" fill="#b23a2a" opacity="0.92"/>
<rect x="1100" y="212" width="48" height="48" rx="5" fill="#b23a2a" opacity="0.92"/>
<rect x="790" y="274" width="48" height="48" rx="5" fill="#b23a2a" opacity="0.92"/>
<rect x="852" y="274" width="48" height="48" rx="5" fill="#2f5568" opacity="0.85"/>
<rect x="914" y="274" width="48" height="48" rx="5" fill="#b23a2a" opacity="0.92"/>
<rect x="976" y="274" width="48" height="48" rx="5" fill="#b23a2a" opacity="0.92"/>
<rect x="1038" y="274" width="48" height="48" rx="5" fill="#b23a2a" opacity="0.92"/>
<rect x="1100" y="274" width="48" height="48" rx="5" fill="#2f5568" opacity="0.85"/>
<rect x="790" y="336" width="48" height="48" rx="5" fill="#b23a2a" opacity="0.92"/>
<rect x="852" y="336" width="48" height="48" rx="5" fill="#b23a2a" opacity="0.92"/>
<rect x="914" y="336" width="48" height="48" rx="5" fill="#2f5568" opacity="0.85"/>
<rect x="976" y="336" width="48" height="48" rx="5" fill="#b23a2a" opacity="0.92"/>
  </g>
  <path d="M710 270 L780 270" stroke="#2f5568" stroke-width="3"/><polygon points="780,262 794,270 780,278" fill="#2f5568"/>
  <text x="790" y="420" font-size="14" fill="#1a1712" font-weight="700">22 en route centers (ARTCCs)</text>
  <g font-size="13" fill="#1a1712">
    <rect x="790" y="438" width="14" height="14" rx="2" fill="#b23a2a"/><text x="812" y="450">17 lost stable comms / radar</text>
    <rect x="790" y="462" width="14" height="14" rx="2" fill="#2f5568"/><text x="812" y="474">5 unaffected</text>
  </g>
  <text x="790" y="500" font-size="11" fill="#7d7363">Tile positions are schematic, not geographic.</text>
  <!-- outcome strip -->
  <rect x="40" y="520" width="1120" height="50" rx="6" fill="#1a1712"/>
  <text x="60" y="551" font-size="15" fill="#f0b429" font-weight="700">RESULT</text>
  <text x="150" y="551" font-size="15" fill="#e8e5d8">nationwide ground stop 4 h 21 m &#183; ~12,000 flights not operated (FAA) &#183; ~60 routers disabled as a precaution</text>
</svg>
