<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b18"/>
      <stop offset="100%" stop-color="#0b1730"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7c3aed"/>
      <stop offset="20%"  stop-color="#2563eb"/>
      <stop offset="40%"  stop-color="#06b6d4"/>
      <stop offset="60%"  stop-color="#22c55e"/>
      <stop offset="80%"  stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050b18" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="900" cy="180" r="380" fill="url(#glow)"/>

  <!-- wave lines representing EM propagation -->
  <g opacity="0.55" stroke-width="2.5" fill="none">
    <path d="M -20 470 C 120 400, 220 540, 360 470 S 620 400, 760 470 S 1020 540, 1220 470" stroke="#38bdf8"/>
    <path d="M -20 500 C 120 440, 220 560, 360 500 S 620 440, 760 500 S 1020 560, 1220 500" stroke="#22d3ee" opacity="0.6"/>
    <path d="M -20 440 C 120 380, 220 500, 360 440 S 620 380, 760 440 S 1020 500, 1220 440" stroke="#818cf8" opacity="0.45"/>
  </g>

  <!-- spectrum bar -->
  <rect x="80" y="518" width="1040" height="14" rx="7" fill="url(#spectrum)"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8" letter-spacing="1">
    <text x="80" y="560">RADIO</text>
    <text x="330" y="560">NEAR-INFRARED</text>
    <text x="620" y="560">VISIBLE</text>
    <text x="1010" y="560" text-anchor="end">X-RAY / UV</text>
  </g>

  <!-- eyebrow -->
  <text x="80" y="140" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#38bdf8" letter-spacing="3" font-weight="600">SAVVY SECURITY LLC</text>

  <!-- title -->
  <text x="78" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#f8fafc" font-weight="700">The Physics of Transmission</text>
  <text x="78" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#cbd5e1" font-weight="400">Why Not All Light Is Created Equal for Data</text>

  <!-- byline -->
  <text x="80" y="360" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#64748b">By Malcolm R. Smith — Principal Manager</text>
</svg>
