<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="DejaVu Sans, sans-serif">
  <rect width="720" height="440" fill="#fbf8f0"/>
  <rect x="1" y="1" width="718" height="438" fill="none" stroke="#ddd6c4" stroke-width="2"/>
  <text x="40" y="50" font-family="DejaVu Serif, serif" font-size="26" font-weight="bold" fill="#1a1712">The load-bearing volunteer</text>
  <text x="40" y="76" font-size="14.5" fill="#5d5545">In 2015, the crypto under a large share of the world&#8217;s secure email had one maintainer.</text>
  <line x1="40" y1="92" x2="680" y2="92" stroke="#a86a22" stroke-width="2"/>

  <!-- dependents -->
  <g font-size="12.5" fill="#1a1712">
    <rect x="60" y="120" width="150" height="34" rx="4" fill="#dfe6ee" stroke="#2f5568"/><text x="135" y="142" text-anchor="middle">Debian / apt signing</text>
    <rect x="60" y="164" width="150" height="34" rx="4" fill="#dfe6ee" stroke="#2f5568"/><text x="135" y="186" text-anchor="middle">Git commit signing</text>
    <rect x="60" y="208" width="150" height="34" rx="4" fill="#dfe6ee" stroke="#2f5568"/><text x="135" y="230" text-anchor="middle">Secure email (PGP)</text>
    <rect x="60" y="252" width="150" height="34" rx="4" fill="#dfe6ee" stroke="#2f5568"/><text x="135" y="274" text-anchor="middle">Linux package repos</text>
    <rect x="60" y="296" width="150" height="34" rx="4" fill="#dfe6ee" stroke="#2f5568"/><text x="135" y="318" text-anchor="middle">Release tarball checks</text>
  </g>

  <!-- arrows to hub -->
  <g stroke="#5d5545" stroke-width="1.5" fill="none">
    <path d="M210 137 C 280 137, 300 205, 352 218" marker-end="url(#a)"/>
    <path d="M210 181 C 270 181, 300 210, 352 221" marker-end="url(#a)"/>
    <path d="M210 225 L 352 225" marker-end="url(#a)"/>
    <path d="M210 269 C 270 269, 300 240, 352 229" marker-end="url(#a)"/>
    <path d="M210 313 C 280 313, 300 245, 352 232" marker-end="url(#a)"/>
  </g>

  <!-- hub -->
  <circle cx="430" cy="225" r="74" fill="#cfe2d6" stroke="#166534" stroke-width="2"/>
  <text x="430" y="212" text-anchor="middle" font-family="DejaVu Serif, serif" font-size="20" font-weight="bold" fill="#1a1712">GnuPG</text>
  <text x="430" y="234" text-anchor="middle" font-size="12.5" fill="#3d4a3f">a GNU package</text>
  <text x="430" y="252" text-anchor="middle" font-size="12.5" fill="#3d4a3f">since 1997</text>

  <!-- maintainer -->
  <path d="M504 225 L 556 225" stroke="#a33" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="558" y="196" width="120" height="58" rx="6" fill="#f2dede" stroke="#a33" stroke-width="2"/>
  <text x="618" y="220" text-anchor="middle" font-family="DejaVu Serif, serif" font-size="15" font-weight="bold" fill="#7a1f1f">1 developer</text>
  <text x="618" y="240" text-anchor="middle" font-size="12" fill="#7a1f1f">nearly out of funds</text>

  <text x="40" y="366" font-size="14" fill="#5d5545">&#8220;Given enough eyeballs, all bugs are shallow&#8221; assumes the eyeballs show up. Free software</text>
  <text x="40" y="386" font-size="14" fill="#5d5545">removes the <tspan font-style="italic">licence</tspan> barrier to auditing &#8212; it does not, by itself, pay anyone to look.</text>

  <text x="40" y="418" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#8a7d5f">Diagram: Savvy Security LLC &#183; after ProPublica, &#8220;&#8230;Relies on One Guy&#8221; (2015)</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5d5545"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#a33"/></marker>
  </defs>
</svg>
