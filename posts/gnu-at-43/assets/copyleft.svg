<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="DejaVu Sans, sans-serif">
  <rect width="720" height="470" fill="#fbf8f0"/>
  <rect x="1" y="1" width="718" height="468" fill="none" stroke="#ddd6c4" stroke-width="2"/>
  <text x="40" y="50" font-family="DejaVu Serif, serif" font-size="27" font-weight="bold" fill="#1a1712">Copyleft: freedom that inherits</text>
  <text x="40" y="76" font-size="14.5" fill="#5d5545">Stallman&#8217;s legal hack &#8212; use copyright to guarantee freedom instead of restrict it.</text>
  <line x1="40" y1="92" x2="680" y2="92" stroke="#a86a22" stroke-width="2"/>

  <!-- Permissive column -->
  <text x="60" y="128" font-family="DejaVu Serif, serif" font-size="18" font-weight="bold" fill="#2f5568">Permissive (BSD / MIT)</text>
  <rect x="60" y="142" width="260" height="46" rx="4" fill="#dfe6ee" stroke="#2f5568" stroke-width="1.5"/>
  <text x="190" y="170" text-anchor="middle" font-size="14" fill="#1a1712">Free source released</text>
  <line x1="190" y1="188" x2="190" y2="214" stroke="#5d5545" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="60" y="216" width="260" height="52" rx="4" fill="#e7dcc0" stroke="#a86a22" stroke-width="1.5"/>
  <text x="190" y="238" text-anchor="middle" font-size="14" fill="#1a1712">Vendor takes it private</text>
  <text x="190" y="257" text-anchor="middle" font-size="12.5" fill="#5d5545">ships a closed binary, legally</text>
  <line x1="190" y1="268" x2="190" y2="294" stroke="#5d5545" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="60" y="296" width="260" height="52" rx="4" fill="#f2dede" stroke="#a33" stroke-width="1.5"/>
  <text x="190" y="318" text-anchor="middle" font-size="14" fill="#7a1f1f">Downstream user</text>
  <text x="190" y="337" text-anchor="middle" font-size="12.5" fill="#7a1f1f">no source, no freedoms, no audit</text>

  <!-- Copyleft column -->
  <text x="400" y="128" font-family="DejaVu Serif, serif" font-size="18" font-weight="bold" fill="#166534">Copyleft (GPL)</text>
  <rect x="400" y="142" width="260" height="46" rx="4" fill="#cfe2d6" stroke="#166534" stroke-width="1.5"/>
  <text x="530" y="170" text-anchor="middle" font-size="14" fill="#1a1712">Free source released</text>
  <line x1="530" y1="188" x2="530" y2="214" stroke="#166534" stroke-width="1.5" marker-end="url(#arrg)"/>
  <rect x="400" y="216" width="260" height="52" rx="4" fill="#cfe2d6" stroke="#166534" stroke-width="1.5"/>
  <text x="530" y="238" text-anchor="middle" font-size="14" fill="#1a1712">Vendor modifies + ships</text>
  <text x="530" y="257" text-anchor="middle" font-size="12.5" fill="#3d4a3f">must pass on source + freedoms</text>
  <line x1="530" y1="268" x2="530" y2="294" stroke="#166534" stroke-width="1.5" marker-end="url(#arrg)"/>
  <rect x="400" y="296" width="260" height="52" rx="4" fill="#cfe2d6" stroke="#166534" stroke-width="1.5"/>
  <text x="530" y="318" text-anchor="middle" font-size="14" fill="#1a1712">Downstream user</text>
  <text x="530" y="337" text-anchor="middle" font-size="12.5" fill="#3d4a3f">same four freedoms, all the way down</text>

  <text x="40" y="392" font-size="14" fill="#5d5545">Both start free. Copyleft is the clause that makes the freedom <tspan font-style="italic">inheritable</tspan> &#8212; every</text>
  <text x="40" y="412" font-size="14" fill="#5d5545">redistributor is bound by the same terms they received. The GPL made that stick in court.</text>

  <text x="40" y="446" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#8a7d5f">Diagram: Savvy Security LLC</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5d5545"/></marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#166534"/></marker>
  </defs>
</svg>
