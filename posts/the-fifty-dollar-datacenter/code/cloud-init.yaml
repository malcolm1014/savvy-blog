#cloud-config
# Paste this into the "Cloud config" box when you create the server.
# Replace the ssh-ed25519 line with YOUR public key from Termux.

groups:
  - docker

users:
  - name: lab
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3...REPLACE-WITH-YOUR-KEY... phone

package_update: true
package_upgrade: true
packages:
  - ufw
  - fail2ban
  - tmux
  - git
  - curl
  - docker.io
  - docker-compose-v2
  - unattended-upgrades

# 4 GB is the floor for Claude Code. Swap keeps the box alive when a scan spikes.
swap:
  filename: /swapfile
  size: 2G
  maxsize: 2G

write_files:
  - path: /etc/ssh/sshd_config.d/10-lab.conf
    permissions: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AllowUsers lab

runcmd:
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw --force enable
  - systemctl enable --now docker fail2ban
  - systemctl restart ssh
