    <circle cx="1026" cy="206" r="5" fill="#4ade80"/>
    <circle cx="1026" cy="256" r="5" fill="#4ade80"/>
    <circle cx="1026" cy="306" r="5" fill="#4ade80"/>
    <circle cx="1026" cy="356" r="5" fill="#f0b429"/>
    <text x="1073" y="432" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#a49c87">RENTED BY</text>
