      <rect x="1012" y="236" width="122" height="40" rx="3"/>
      <rect x="1012" y="286" width="122" height="40" rx="3"/>
      <rect x="1012" y="336" width="122" height="40" rx="3"/>
    </g>
    <g font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#d7cbb0">
