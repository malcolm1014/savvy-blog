    <rect x="757" y="146" width="144" height="278" rx="6" fill="#0a0f0b" stroke="#2c2e24"/>
    <circle cx="829" cy="134" r="4" fill="#2c2e24"/>
    <g font-family="DejaVu Sans Mono, monospace" font-size="11">
      <text x="766" y="170" fill="#86efac">$ ssh lab</text>
      <text x="766" y="190" fill="#7d7363">lab@box:~$</text>
      <text x="766" y="210" fill="#d7cbb0">tmux new -s w</text>
      <text x="766" y="230" fill="#7d7363">lab@box:~$</text>
      <text x="766" y="250" fill="#f0b429">claude</text>
      <rect x="766" y="266" width="126" height="1" fill="#2c2e24"/>
      <text x="766" y="288" fill="#d7cbb0">&gt; build the lab</text>
      <text x="766" y="308" fill="#86efac">✓ db   healthy</text>
      <text x="766" y="328" fill="#86efac">✓ app  up</text>
      <text x="766" y="348" fill="#f08c7a">! 2 findings</text>
      <rect x="766" y="362" width="8" height="14" fill="#86efac"/>
    </g>
    <text x="829" y="482" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#a49c87">$49.88 PHONE</text>
  </g>

  <!-- link -->
  <path d="M913 285 H990" stroke="#e0a256" stroke-width="3" stroke-dasharray="7 6" fill="none"/>
  <path d="M990 285 l-12 -7 v14 z" fill="#e0a256"/>
  <text x="951" y="268" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e0a256">SSH :22</text>

  <!-- server rack -->
