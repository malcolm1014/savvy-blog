<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#1a1f18" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#0d110d"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <text x="70" y="110" font-family="DejaVu Sans Mono, monospace" font-weight="700" font-size="20" fill="#e0a256" letter-spacing="1">SAVVY SECURITY LLC</text>
  <rect x="70" y="126" width="150" height="3" fill="#e0a256"/>
  <text x="330" y="110" font-family="DejaVu Sans Mono, monospace" font-size="19" fill="#a49c87" letter-spacing="1">// FIELD GUIDE</text>
  <text x="68" y="232" font-family="DejaVu Serif, serif" font-weight="700" font-size="58" fill="#a49c87">The</text>
  <text x="66" y="312" font-family="DejaVu Serif, serif" font-weight="700" font-size="76" fill="#e8e5d8">Fifty-Dollar</text>
  <text x="66" y="398" font-family="DejaVu Serif, serif" font-weight="700" font-size="76" fill="#e8e5d8">Datacenter</text>
