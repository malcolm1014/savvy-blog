    <tspan x="70" y="497">AI over SSH. A real lab for what you build.</tspan>
  </text>
  <text x="70" y="580" font-family="DejaVu Sans Mono, monospace" font-weight="700" font-size="17" fill="#7fa6c2" letter-spacing="1">MALCOLM R. SMITH</text>

