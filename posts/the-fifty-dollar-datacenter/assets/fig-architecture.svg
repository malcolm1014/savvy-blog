<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">
  <rect width="900" height="470" fill="#0d1410"/>
  <text x="30" y="38" font-size="14" font-weight="700" fill="#e0a256" letter-spacing="1">FIG. 1 — THE WHOLE RIG</text>

  <!-- phone -->
  <rect x="30" y="80" width="190" height="320" rx="18" fill="#141a14" stroke="#7fa6c2" stroke-width="2.5"/>
  <text x="125" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#7fa6c2">YOUR PHONE</text>
  <rect x="48" y="130" width="154" height="62" rx="5" fill="#0a0f0b" stroke="#2c2e24"/>
  <text x="125" y="156" text-anchor="middle" font-size="13" fill="#e8e5d8">Termux</text>
  <text x="125" y="176" text-anchor="middle" font-size="11" fill="#a49c87">ssh + private key</text>
  <rect x="48" y="206" width="154" height="62" rx="5" fill="#0a0f0b" stroke="#2c2e24"/>
  <text x="125" y="232" text-anchor="middle" font-size="13" fill="#e8e5d8">Browser</text>
  <text x="125" y="252" text-anchor="middle" font-size="11" fill="#a49c87">localhost:8000</text>
  <text x="125" y="306" text-anchor="middle" font-size="11" fill="#a49c87">a screen and</text>
  <text x="125" y="324" text-anchor="middle" font-size="11" fill="#a49c87">a keyboard.</text>
  <text x="125" y="342" text-anchor="middle" font-size="11" fill="#a49c87">nothing runs here.</text>

  <!-- tunnel -->
  <path d="M220 160 H352" stroke="#e0a256" stroke-width="2.5" fill="none"/>
  <path d="M352 160 l-11 -6 v12 z" fill="#e0a256"/>
  <text x="286" y="148" text-anchor="middle" font-size="12" fill="#e0a256">SSH, port 22</text>
  <path d="M220 238 H352" stroke="#e0a256" stroke-width="2.5" stroke-dasharray="6 5" fill="none"/>
  <path d="M220 238 l11 -6 v12 z" fill="#e0a256"/>
  <text x="286" y="226" text-anchor="middle" font-size="12" fill="#e0a256">tunnel -L 8000</text>
  <text x="286" y="262" text-anchor="middle" font-size="10.5" fill="#7d7363">the only open</text>
  <text x="286" y="277" text-anchor="middle" font-size="10.5" fill="#7d7363">port is 22</text>

  <!-- server -->
  <rect x="356" y="60" width="514" height="380" rx="10" fill="#141a14" stroke="#e0a256" stroke-width="2.5"/>
  <text x="376" y="90" font-size="14" font-weight="700" fill="#e0a256">HETZNER CLOUD SERVER</text>
  <text x="850" y="90" text-anchor="end" font-size="11" fill="#a49c87">Ubuntu · ufw · fail2ban</text>

  <rect x="376" y="108" width="474" height="74" rx="5" fill="#0a0f0b" stroke="#2c2e24"/>
  <text x="392" y="134" font-size="13" fill="#e8e5d8">tmux session → Claude Code</text>
  <text x="392" y="156" font-size="11" fill="#a49c87">runs as user "lab". writes the code, builds the</text>
  <text x="392" y="171" font-size="11" fill="#a49c87">containers, runs the scanners, reads the results.</text>

  <rect x="376" y="198" width="474" height="222" rx="5" fill="none" stroke="#7fa6c2" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="392" y="222" font-size="12" font-weight="700" fill="#7fa6c2">DOCKER NETWORK lab_net (private)</text>

  <rect x="392" y="238" width="136" height="76" rx="5" fill="#0a0f0b" stroke="#4ade80"/>
  <text x="460" y="266" text-anchor="middle" font-size="13" fill="#e8e5d8">app</text>
  <text x="460" y="286" text-anchor="middle" font-size="10.5" fill="#a49c87">your SaaS</text>
  <text x="460" y="302" text-anchor="middle" font-size="10.5" fill="#86efac">127.0.0.1:8000</text>

  <rect x="545" y="238" width="136" height="76" rx="5" fill="#0a0f0b" stroke="#4ade80"/>
  <text x="613" y="266" text-anchor="middle" font-size="13" fill="#e8e5d8">db</text>
  <text x="613" y="286" text-anchor="middle" font-size="10.5" fill="#a49c87">postgres</text>
  <text x="613" y="302" text-anchor="middle" font-size="10.5" fill="#a49c87">no host port</text>

  <rect x="698" y="238" width="136" height="76" rx="5" fill="#0a0f0b" stroke="#f0b429"/>
  <text x="766" y="266" text-anchor="middle" font-size="13" fill="#e8e5d8">scanners</text>
  <text x="766" y="286" text-anchor="middle" font-size="10.5" fill="#a49c87">ZAP · Trivy</text>
  <text x="766" y="302" text-anchor="middle" font-size="10.5" fill="#a49c87">Semgrep</text>

  <path d="M528 276 H545" stroke="#4ade80" stroke-width="2"/>
  <path d="M766 314 C766 362 460 362 460 314" stroke="#f0b429" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
  <path d="M460 314 l-6 11 h12 z" fill="#f0b429"/>
  <text x="613" y="376" text-anchor="middle" font-size="11" fill="#f0b429">attack your own app, from inside</text>
  <text x="613" y="406" text-anchor="middle" font-size="11" fill="#7d7363">nothing in this box is reachable from the internet</text>
</svg>
