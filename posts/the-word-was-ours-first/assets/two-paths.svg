<svg width="1000" height="540" viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <rect width="1000" height="540" rx="14" fill="#0c120d" stroke="#22c55e" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="500" y="46" text-anchor="middle" font-size="21" font-weight="700" fill="#e8e5d8" letter-spacing="1">TWO PATHS, ONE SKILL SET</text>

  <!-- start node -->
  <g transform="translate(500,92)">
    <rect x="-150" y="-22" width="300" height="46" rx="10" fill="#10231a" stroke="#4ade80" stroke-width="1.5"/>
    <text x="0" y="7" text-anchor="middle" font-size="14" fill="#86efac">You can break into things.</text>
  </g>

  <!-- fork lines -->
  <path d="M 440 116 Q 300 150 260 180" stroke="#4ade80" stroke-width="2.5" fill="none"/>
  <path d="M 560 116 Q 700 150 740 180" stroke="#c6342e" stroke-width="2.5" fill="none"/>

  <!-- LEFT PATH: white/grey -->
  <g transform="translate(60,180)">
    <rect x="0" y="0" width="400" height="300" rx="12" fill="#0e1a12" stroke="#22c55e" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="200" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#4ade80">ASK FIRST</text>
    <g font-size="12.5" fill="#d4dbd0">
      <text x="24" y="70">&#9656; Get the scope and the signed contract.</text>
      <text x="24" y="98">&#9656; Report the bug. Collect the bounty.</text>
      <text x="24" y="126">&#9656; Build a name you can put on a r&#233;sum&#233;.</text>
      <text x="24" y="154">&#9656; Pass the background check.</text>
      <text x="24" y="182">&#9656; Get the clearance. Get the gov job.</text>
    </g>
    <line x1="24" y1="206" x2="376" y2="206" stroke="#2a3a2e"/>
    <text x="24" y="236" font-size="13" font-weight="700" fill="#86efac">PAYOFF</text>
    <text x="24" y="262" font-size="12.5" fill="#d4dbd0">A 20-year career. Mitnick did his time,</text>
    <text x="24" y="282" font-size="12.5" fill="#d4dbd0">then sold out keynotes as a defender.</text>
  </g>

  <!-- RIGHT PATH: black -->
  <g transform="translate(540,180)">
    <rect x="0" y="0" width="400" height="300" rx="12" fill="#1a0f0e" stroke="#c6342e" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="200" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#e06b63">TAKE IT ANYWAY</text>
    <g font-size="12.5" fill="#e4cfcc">
      <text x="24" y="70">&#9656; Skip the contract. Keep what you find.</text>
      <text x="24" y="98">&#9656; Faster money &#8212; the reports say 2&#8211;3&#215;.</text>
      <text x="24" y="126">&#9656; Then: the wallet is traceable.</text>
      <text x="24" y="154">&#9656; An informant you trusted flips.</text>
      <text x="24" y="182">&#9656; The indictment has your handle on it.</text>
    </g>
    <line x1="24" y1="206" x2="376" y2="206" stroke="#3a2a28"/>
    <text x="24" y="236" font-size="13" font-weight="700" fill="#e06b63">PRICE</text>
    <text x="24" y="262" font-size="12.5" fill="#e4cfcc">Albert Gonzalez: 20 years. Hutchins:</text>
    <text x="24" y="282" font-size="12.5" fill="#e4cfcc">cuffed at the airport leaving DEF CON.</text>
  </g>

  <text x="500" y="520" text-anchor="middle" font-size="13" fill="#9fb0a2">It is better to take the smaller cheque, keep your record clean, and still be hireable at forty.</text>
</svg>
