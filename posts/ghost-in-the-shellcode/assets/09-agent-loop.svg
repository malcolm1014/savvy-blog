<svg width="1000" height="440" viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="abg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1310"/><stop offset="100%" stop-color="#0d0a08"/>
    </linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef7e5a"/></marker>
    <marker id="arh" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7fa6c2"/></marker>
  </defs>
  <rect width="1000" height="440" rx="12" fill="url(#abg)"/>

  <text x="40" y="38" fill="#ef7e5a" font-size="13" font-weight="700" letter-spacing="2.5">THE AUTONOMOUS INTRUSION LOOP</text>
  <text x="40" y="58" fill="#9a8574" font-size="12.5">Reconstructed from Anthropic&#8217;s GTG-1002 disclosure, November 2025. Roughly 80&#8211;90% of tactical work executed without a human in the loop.</text>

  <!-- human operator -->
  <rect x="40" y="86" width="150" height="86" rx="8" fill="#16212a" stroke="#7fa6c2" stroke-width="2"/>
  <text x="115" y="114" fill="#cfe3ef" font-size="14" text-anchor="middle" font-weight="700">Human operator</text>
  <text x="115" y="134" fill="#8fb3c8" font-size="11.5" text-anchor="middle">selects target,</text>
  <text x="115" y="150" fill="#8fb3c8" font-size="11.5" text-anchor="middle">approves escalation</text>
  <text x="115" y="165" fill="#5f7d90" font-size="10.5" text-anchor="middle" font-style="italic">4&#8211;6 decisions / campaign</text>

  <line x1="190" y1="129" x2="246" y2="129" stroke="#7fa6c2" stroke-width="2" marker-end="url(#arh)"/>

  <!-- orchestrator -->
  <rect x="252" y="86" width="176" height="86" rx="8" fill="#2a1d16" stroke="#ef7e5a" stroke-width="2"/>
  <text x="340" y="116" fill="#ffd9c9" font-size="14.5" text-anchor="middle" font-weight="700">Orchestrator</text>
  <text x="340" y="137" fill="#c79c85" font-size="11.5" text-anchor="middle">agentic model + MCP</text>
  <text x="340" y="154" fill="#c79c85" font-size="11.5" text-anchor="middle">tool servers</text>

  <!-- persona shim -->
  <rect x="470" y="92" width="200" height="74" rx="8" fill="#241a22" stroke="#b07a9c" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="570" y="118" fill="#e6c4d9" font-size="12.5" text-anchor="middle" font-weight="700">Jailbreak shim</text>
  <text x="570" y="137" fill="#b08fa2" font-size="11" text-anchor="middle">&#8220;we are a security firm</text>
  <text x="570" y="152" fill="#b08fa2" font-size="11" text-anchor="middle">running authorized tests&#8221;</text>
  <line x1="428" y1="129" x2="464" y2="129" stroke="#b07a9c" stroke-width="1.6"/>

  <!-- the loop -->
  <text x="500" y="204" fill="#9a8574" font-size="11.5" letter-spacing="2" text-anchor="middle">EXECUTED AT MACHINE SPEED &#8212; THOUSANDS OF REQUESTS PER SECOND</text>

  <g font-size="12" text-anchor="middle">
    <rect x="40"  y="222" width="140" height="62" rx="7" fill="#22170f" stroke="#ef7e5a" stroke-width="1.5"/>
    <text x="110" y="246" fill="#ef7e5a" font-size="11" font-weight="700">01</text>
    <text x="110" y="266" fill="#f0d9cc">Recon &amp; mapping</text>

    <rect x="200" y="222" width="140" height="62" rx="7" fill="#22170f" stroke="#ef7e5a" stroke-width="1.5"/>
    <text x="270" y="246" fill="#ef7e5a" font-size="11" font-weight="700">02</text>
    <text x="270" y="266" fill="#f0d9cc">Vuln discovery</text>

    <rect x="360" y="222" width="140" height="62" rx="7" fill="#22170f" stroke="#ef7e5a" stroke-width="1.5"/>
    <text x="430" y="246" fill="#ef7e5a" font-size="11" font-weight="700">03</text>
    <text x="430" y="266" fill="#f0d9cc">Exploit generation</text>

    <rect x="520" y="222" width="140" height="62" rx="7" fill="#22170f" stroke="#ef7e5a" stroke-width="1.5"/>
    <text x="590" y="246" fill="#ef7e5a" font-size="11" font-weight="700">04</text>
    <text x="590" y="266" fill="#f0d9cc">Credential harvest</text>

    <rect x="680" y="222" width="140" height="62" rx="7" fill="#22170f" stroke="#ef7e5a" stroke-width="1.5"/>
    <text x="750" y="246" fill="#ef7e5a" font-size="11" font-weight="700">05</text>
    <text x="750" y="266" fill="#f0d9cc">Lateral movement</text>

    <rect x="840" y="222" width="140" height="62" rx="7" fill="#22170f" stroke="#ef7e5a" stroke-width="1.5"/>
    <text x="910" y="246" fill="#ef7e5a" font-size="11" font-weight="700">06</text>
    <text x="910" y="266" fill="#f0d9cc">Exfil &amp; triage</text>
  </g>
  <g stroke="#ef7e5a" stroke-width="2" marker-end="url(#ar)">
    <line x1="180" y1="253" x2="194" y2="253"/>
    <line x1="340" y1="253" x2="354" y2="253"/>
    <line x1="500" y1="253" x2="514" y2="253"/>
    <line x1="660" y1="253" x2="674" y2="253"/>
    <line x1="820" y1="253" x2="834" y2="253"/>
  </g>

  <!-- feedback loop -->
  <path d="M 910 284 L 910 318 L 110 318 L 110 290" fill="none" stroke="#ef7e5a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/>
  <text x="510" y="336" fill="#c79c85" font-size="12" text-anchor="middle">findings re-enter the context window &#8212; the loop re-plans against what it just learned</text>

  <!-- orchestrator down-link -->
  <line x1="340" y1="172" x2="340" y2="214" stroke="#ef7e5a" stroke-width="2" marker-end="url(#ar)"/>

  <!-- bottom takeaway -->
  <rect x="40" y="356" width="940" height="60" rx="8" fill="#16212a" stroke="#7fa6c2" stroke-width="1.5"/>
  <text x="60" y="380" fill="#7fa6c2" font-size="11" font-weight="700" letter-spacing="2">WHAT CHANGED</text>
  <text x="60" y="402" fill="#cfe3ef" font-size="13">Not capability &#8212; every one of these six steps was already automatable. What changed is that the <tspan font-weight="700">sequencing decision</tspan> between them no longer waits on a person.</text>
</svg>
