<svg width="1100" height="460" viewBox="0 0 1100 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="panelbg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1a30"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="460" rx="12" fill="url(#panelbg)"/>

  <!-- axes -->
  <line x1="60" y1="380" x2="1040" y2="380" stroke="#334155" stroke-width="2"/>
  <text x="1045" y="386" fill="#94a3b8" font-size="15">space →</text>
  <line x1="60" y1="380" x2="60" y2="40" stroke="#334155" stroke-width="2"/>
  <text x="40" y="35" fill="#94a3b8" font-size="15" text-anchor="middle">time</text>
  <text x="40" y="52" fill="#94a3b8" font-size="15" text-anchor="middle">↑</text>

  <!-- five stations along the rotation axis, light cones tipping progressively -->
  <!-- each cone: apex at station, two rays representing the future light cone edges -->
  <g stroke-linecap="round">
    <!-- station 1: upright cone, no rotation -->
    <g transform="translate(160,380)">
      <line x1="0" y1="0" x2="-46" y2="-190" stroke="#60a5fa" stroke-width="3"/>
      <line x1="0" y1="0" x2="46" y2="-190" stroke="#60a5fa" stroke-width="3"/>
      <circle cx="0" cy="0" r="5" fill="#e5e7eb"/>
    </g>
    <!-- station 2: cone tips slightly -->
    <g transform="translate(360,380)">
      <line x1="0" y1="0" x2="-6" y2="-193" stroke="#7cb4fb" stroke-width="3"/>
      <line x1="0" y1="0" x2="92" y2="-172" stroke="#7cb4fb" stroke-width="3"/>
      <circle cx="0" cy="0" r="5" fill="#e5e7eb"/>
    </g>
    <!-- station 3: cone tips further, one edge nearly horizontal -->
    <g transform="translate(560,380)">
      <line x1="0" y1="0" x2="50" y2="-186" stroke="#93c5fd" stroke-width="3"/>
      <line x1="0" y1="0" x2="185" y2="-70" stroke="#93c5fd" stroke-width="3"/>
      <circle cx="0" cy="0" r="5" fill="#e5e7eb"/>
    </g>
    <!-- station 4: cone tipped past vertical — one edge points backward-in-time -->
    <g transform="translate(760,380)">
      <line x1="0" y1="0" x2="118" y2="-155" stroke="#bfdbfe" stroke-width="3"/>
      <line x1="0" y1="0" x2="150" y2="40" stroke="#f87171" stroke-width="3.4"/>
      <circle cx="0" cy="0" r="5" fill="#e5e7eb"/>
    </g>
    <!-- station 5: fully tipped — the "future" edge points into the past -->
    <g transform="translate(940,380)">
      <line x1="0" y1="0" x2="86" y2="-176" stroke="#dbeafe" stroke-width="3"/>
      <line x1="0" y1="0" x2="130" y2="90" stroke="#ef4444" stroke-width="3.6"/>
      <circle cx="0" cy="0" r="5" fill="#e5e7eb"/>
    </g>
  </g>

  <!-- dashed curve connecting the stations, suggesting the rotating-frame trajectory -->
  <path d="M 160 380 Q 460 410 560 380 T 940 380" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- labels -->
  <text x="160" y="410" fill="#94a3b8" font-size="14" text-anchor="middle">upright</text>
  <text x="560" y="410" fill="#94a3b8" font-size="14" text-anchor="middle">tipping</text>
  <text x="940" y="410" fill="#fca5a5" font-size="14" text-anchor="middle" font-weight="600">past vertical → CTC</text>

  <text x="550" y="440" fill="#64748b" font-size="13.5" text-anchor="middle">Rotating spacetime (Gödel / van Stockum): light cones tip progressively until a loop closes on itself, all without exceeding the speed of light.</text>
</svg>
