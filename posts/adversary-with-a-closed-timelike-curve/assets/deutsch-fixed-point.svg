<svg width="1000" height="420" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="panelbg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1a30"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#93c5fd"/>
    </marker>
    <marker id="arrowloop" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f0b429"/>
    </marker>
  </defs>
  <rect width="1000" height="420" rx="12" fill="url(#panelbg2)"/>

  <!-- CR (chronology-respecting) input -->
  <text x="70" y="150" fill="#94a3b8" font-size="16" text-anchor="middle">input</text>
  <text x="70" y="172" fill="#e5e7eb" font-size="20" text-anchor="middle">ρ_CR</text>
  <line x1="105" y1="160" x2="220" y2="160" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- U box -->
  <rect x="230" y="90" width="180" height="200" rx="10" fill="#111c33" stroke="#60a5fa" stroke-width="2"/>
  <text x="320" y="195" fill="#f8fafc" font-size="30" text-anchor="middle" font-weight="700">U</text>
  <text x="320" y="222" fill="#94a3b8" font-size="13" text-anchor="middle">unitary interaction</text>

  <!-- CR output -->
  <line x1="410" y1="160" x2="530" y2="160" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="590" y="150" fill="#94a3b8" font-size="16" text-anchor="middle">output</text>
  <text x="590" y="172" fill="#e5e7eb" font-size="20" text-anchor="middle">ρ_CR′</text>

  <!-- CTC register feeding into U from below -->
  <line x1="320" y1="290" x2="320" y2="345" stroke="#f0b429" stroke-width="2.5"/>
  <path d="M 320 345 L 620 345 L 620 220" fill="none" stroke="#f0b429" stroke-width="2.5" marker-end="url(#arrowloop)"/>
  <text x="470" y="368" fill="#fbbf24" font-size="15" text-anchor="middle">ρ_CTC (traced out, fed back)</text>

  <!-- loop back into U from the top -->
  <path d="M 620 220 L 700 220 L 700 60 L 320 60 L 320 90" fill="none" stroke="#f0b429" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="700" y="45" fill="#fbbf24" font-size="13.5" text-anchor="middle">the loop closes on itself</text>

  <!-- equation panel -->
  <rect x="700" y="240" width="260" height="140" rx="10" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
  <text x="830" y="270" fill="#94a3b8" font-size="13" text-anchor="middle">consistency condition</text>
  <text x="830" y="305" fill="#e5e7eb" font-size="16.5" text-anchor="middle">ρ_CTC =</text>
  <text x="830" y="330" fill="#e5e7eb" font-size="15" text-anchor="middle">Tr_CR[ U(ρ_CR⊗ρ_CTC)U† ]</text>
  <text x="830" y="360" fill="#64748b" font-size="12.5" text-anchor="middle">Brouwer guarantees a fixed point exists</text>

  <text x="500" y="410" fill="#64748b" font-size="13.5" text-anchor="middle">Deutsch's model: nature must supply a ρ_CTC that reproduces itself after the interaction — a fixed point, not a paradox.</text>
</svg>
