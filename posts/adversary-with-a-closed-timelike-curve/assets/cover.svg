<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111c33"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="990" cy="140" r="360" fill="url(#glow)"/>

  <!-- blueprint grid, right third -->
  <g stroke="#3b82f6" stroke-width="1" opacity="0.16">
    <line x1="860" y1="0" x2="860" y2="630"/>
    <line x1="940" y1="0" x2="940" y2="630"/>
    <line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="1180" y1="0" x2="1180" y2="630"/>
    <line x1="800" y1="80" x2="1200" y2="80"/>
    <line x1="800" y1="200" x2="1200" y2="200"/>
    <line x1="800" y1="320" x2="1200" y2="320"/>
    <line x1="800" y1="440" x2="1200" y2="440"/>
    <line x1="800" y1="560" x2="1200" y2="560"/>
  </g>

  <!-- closed timelike curve motif: a loop of progressively tipping light cones -->
  <g transform="translate(1010,470)">
    <circle r="118" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="3 7" opacity="0.55"/>
    <!-- direction arrowhead on the loop -->
    <path d="M 118 -14 L 132 0 L 118 14" fill="none" stroke="#93c5fd" stroke-width="3" opacity="0.85"/>

    <!-- four light cones (bowties) placed around the loop, tilting progressively -->
    <g transform="translate(0,-118) rotate(0)" stroke="#f8fafc" stroke-width="2.4" fill="none" opacity="0.9">
      <path d="M -20 -16 L 0 0 L -20 16"/>
      <path d="M 20 -16 L 0 0 L 20 16"/>
    </g>
    <g transform="translate(118,0) rotate(45)" stroke="#bfdbfe" stroke-width="2.4" fill="none" opacity="0.8">
      <path d="M -20 -16 L 0 0 L -20 16"/>
      <path d="M 20 -16 L 0 0 L 20 16"/>
    </g>
    <g transform="translate(0,118) rotate(100)" stroke="#60a5fa" stroke-width="2.4" fill="none" opacity="0.75">
      <path d="M -20 -16 L 0 0 L -20 16"/>
      <path d="M 20 -16 L 0 0 L 20 16"/>
    </g>
    <g transform="translate(-118,0) rotate(155)" stroke="#3b82f6" stroke-width="2.4" fill="none" opacity="0.7">
      <path d="M -20 -16 L 0 0 L -20 16"/>
      <path d="M 20 -16 L 0 0 L 20 16"/>
    </g>
  </g>
  <text x="1010" y="622" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#93c5fd" letter-spacing="1.5" text-anchor="middle" opacity="0.85">LIGHT CONES, TIPPED PAST VERTICAL</text>

  <!-- eyebrow -->
  <text x="80" y="120" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#60a5fa" letter-spacing="3" font-weight="600">SAVVY SECURITY LLC</text>

  <!-- title -->
  <text x="78" y="205" font-family="Georgia, 'Times New Roman', serif" font-size="48" fill="#f8fafc" font-weight="700">The Adversary With a</text>
  <text x="78" y="266" font-family="Georgia, 'Times New Roman', serif" font-size="48" fill="#f8fafc" font-weight="700">Closed Timelike Curve</text>

  <!-- subtitle -->
  <text x="80" y="316" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#94a3b8" font-weight="400">What physics says about time that folds back on itself</text>

  <!-- byline -->
  <text x="80" y="386" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#64748b">By Malcolm R. Smith</text>
</svg>
