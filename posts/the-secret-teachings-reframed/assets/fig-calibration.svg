<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">
  <rect width="1000" height="520" fill="#0d1410"/>
  <rect x="0.5" y="0.5" width="999" height="519" fill="none" stroke="#2c2e24"/>

  <text x="56" y="50" fill="#e0a256" font-size="15" font-weight="700" letter-spacing="1.2">EVERY CLAIM, RATED &#8212; THE CALIBRATED LEDGER</text>
  <text x="56" y="72" fill="#a49c87" font-size="12.5">The engine attaches a confidence to each claim and names its basis. Longer bar = better evidence. Nothing is asserted flat.</text>

  <!-- scale: x from 300 (0.0) to 920 (1.0); 0.5 gridline -->
  <!-- gridlines -->
  <g stroke="#2c2e24" stroke-width="1">
    <line x1="300" y1="110" x2="300" y2="430"/>
    <line x1="455" y1="110" x2="455" y2="430"/>
    <line x1="610" y1="110" x2="610" y2="430"/>
    <line x1="765" y1="110" x2="765" y2="430"/>
    <line x1="920" y1="110" x2="920" y2="430"/>
  </g>
  <g fill="#7d7363" font-size="10" text-anchor="middle">
    <text x="300" y="448">0.0</text><text x="455" y="448">0.25</text><text x="610" y="448">0.50</text><text x="765" y="448">0.75</text><text x="920" y="448">1.0</text>
  </g>
  <text x="610" y="470" fill="#8c8575" font-size="11" text-anchor="middle">calibrated confidence</text>

  <!-- bars: x width = 300 + conf*620. label left-aligned at 60 -->
  <!-- row y positions -->
  <!-- 0.97 -->
  <g>
    <text x="60" y="140" fill="#e8e5d8" font-size="12">1928 / public domain</text>
    <text x="60" y="156" fill="#7d7363" font-size="9.5">basis: title page, read from source</text>
    <rect x="300" y="128" width="601" height="26" rx="3" fill="#86efac"/>
    <text x="892" y="146" fill="#0d1410" font-size="11.5" font-weight="700" text-anchor="end">0.97</text>
  </g>
  <!-- 0.95 -->
  <g>
    <text x="60" y="196" fill="#e8e5d8" font-size="12">preface disclaims, no footnotes</text>
    <text x="60" y="212" fill="#7d7363" font-size="9.5">basis: Hall&#8217;s own preface</text>
    <rect x="300" y="184" width="589" height="26" rx="3" fill="#86efac"/>
    <text x="880" y="202" fill="#0d1410" font-size="11.5" font-weight="700" text-anchor="end">0.95</text>
  </g>
  <!-- 0.90 -->
  <g>
    <text x="60" y="252" fill="#e8e5d8" font-size="12">Hermetica redated 100&#8211;300 CE</text>
    <text x="60" y="268" fill="#7d7363" font-size="9.5">basis: Casaubon; Copenhaver 1992; Bull 2018</text>
    <rect x="300" y="240" width="558" height="26" rx="3" fill="#9fe0b0"/>
    <text x="849" y="258" fill="#0d1410" font-size="11.5" font-weight="700" text-anchor="end">0.90</text>
  </g>
  <!-- 0.85 seven-principles -->
  <g>
    <text x="60" y="308" fill="#e8e5d8" font-size="12">seven-fold scheme is modern</text>
    <text x="60" y="324" fill="#7d7363" font-size="9.5">basis: unattested pre-1908; Chapel</text>
    <rect x="300" y="296" width="527" height="26" rx="3" fill="#cde9b0"/>
    <text x="818" y="314" fill="#0d1410" font-size="11.5" font-weight="700" text-anchor="end">0.85</text>
  </g>
  <!-- 0.80 lineage -->
  <g>
    <text x="60" y="364" fill="#e8e5d8" font-size="12">single-source lineage: constructed</text>
    <text x="60" y="380" fill="#7d7363" font-size="9.5">basis: Hanegraaff 2012; Yates 1964</text>
    <rect x="300" y="352" width="496" height="26" rx="3" fill="#e0d58a"/>
    <text x="787" y="370" fill="#0d1410" font-size="11.5" font-weight="700" text-anchor="end">0.80</text>
  </g>
  <!-- 0.82 overall verdict, distinct accent -->
  <g>
    <text x="60" y="420" fill="#edc187" font-size="12" font-weight="700">OVERALL: compendium, not history</text>
    <rect x="300" y="408" width="508" height="26" rx="3" fill="#e0a256"/>
    <text x="799" y="426" fill="#0d1410" font-size="11.5" font-weight="700" text-anchor="end">0.82</text>
  </g>

  <text x="56" y="500" fill="#a49c87" font-size="11.5">The point of calibration: a confident wrong answer and an honest &#8220;0.8&#8221; look different &#8212; and here the strongest bars are the checkable ones.</text>
</svg>
