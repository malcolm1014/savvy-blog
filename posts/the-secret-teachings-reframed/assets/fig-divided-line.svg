<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">
  <rect width="1000" height="560" fill="#0d1410"/>
  <rect x="0.5" y="0.5" width="999" height="559" fill="none" stroke="#2c2e24"/>

  <defs>
    <marker id="up" markerWidth="10" markerHeight="10" refX="5" refY="2" orient="auto"><path d="M0,10 L5,0 L10,10 z" fill="#e0a256"/></marker>
  </defs>

  <text x="56" y="56" fill="#e0a256" font-size="15" font-weight="700" letter-spacing="1.5">CLIMBING THE DIVIDED LINE</text>
  <text x="56" y="78" fill="#a49c87" font-size="12.5">a symbol is not a truth &#8212; it is a shadow of a structure. The work is the ascent.</text>

  <!-- four tiers, bottom (appearance) to top (Form) -->
  <!-- tier geometry -->
  <!-- EIKASIA -->
  <rect x="300" y="430" width="470" height="70" rx="6" fill="#161b15" stroke="#3a3f30"/>
  <text x="320" y="458" fill="#e8e5d8" font-size="13" font-weight="700">EIKASIA &#183; appearance</text>
  <text x="320" y="480" fill="#a49c87" font-size="11.5">the symbol as given &#8212; a serpent, a triangle, &#8220;as above, so below&#8221;</text>
  <!-- PISTIS -->
  <rect x="300" y="330" width="470" height="70" rx="6" fill="#161b15" stroke="#3a3f30"/>
  <text x="320" y="358" fill="#e8e5d8" font-size="13" font-weight="700">PISTIS &#183; the thing depicted</text>
  <text x="320" y="380" fill="#a49c87" font-size="11.5">what the symbol stands for in its own tradition</text>
  <!-- DIANOIA -->
  <rect x="300" y="230" width="470" height="70" rx="6" fill="#13201a" stroke="#4a6f57"/>
  <text x="320" y="258" fill="#cfe9d6" font-size="13" font-weight="700">DIANOIA &#183; structure</text>
  <text x="320" y="280" fill="#a49c87" font-size="11.5">the variables and relations underneath the image</text>
  <!-- NOESIS -->
  <rect x="300" y="130" width="470" height="70" rx="6" fill="#10211a" stroke="#86efac"/>
  <text x="320" y="158" fill="#cdeedd" font-size="13" font-weight="700">NOESIS &#183; the Form</text>
  <text x="320" y="180" fill="#9fd9b4" font-size="12">the governing relation &#8212; P(y&#124;do&#8201;x),&#8194;&#10216;h,d&#10217;,&#8194;&#961;(A)</text>

  <!-- rising arrow on the left through the tiers -->
  <line x1="150" y1="500" x2="150" y2="150" stroke="#e0a256" stroke-width="3" marker-end="url(#up)"/>
  <text x="96" y="330" fill="#e0a256" font-size="12" transform="rotate(-90 96,330)" text-anchor="middle">the ascent &#183; stripping circumstance</text>

  <!-- annotations: where each stops -->
  <line x1="770" y1="395" x2="930" y2="395" stroke="#d65a48" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="792" y="388" fill="#d65a48" font-size="11.5">Hall freezes the symbol here</text>
  <text x="792" y="414" fill="#a49c87" font-size="10.5">&#8212; preserved, but un-formalized</text>

  <line x1="770" y1="165" x2="930" y2="165" stroke="#86efac" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="792" y="158" fill="#86efac" font-size="11.5">Plato 1 climbs to here</text>
  <text x="792" y="184" fill="#a49c87" font-size="10.5">&#8212; the symbol compiled to a Form</text>

  <text x="56" y="536" fill="#a49c87" font-size="12">The occult error is to mistake a shadow (the symbol) for the Form and stop. Formalization is just finishing the climb.</text>
</svg>
