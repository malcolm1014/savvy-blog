<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">
  <rect width="1000" height="560" fill="#0d1410"/>
  <rect x="0.5" y="0.5" width="999" height="559" fill="none" stroke="#2c2e24"/>

  <defs>
    <marker id="rh" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d65a48"/></marker>
    <marker id="gh" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#86efac"/></marker>
    <marker id="nh" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#a49c87"/></marker>
  </defs>

  <text x="56" y="56" fill="#e0a256" font-size="15" font-weight="700" letter-spacing="1.5">THREE WAYS TO READ A BOOK LIKE THIS</text>

  <!-- the book -->
  <rect x="56" y="246" width="150" height="70" rx="6" fill="#161b15" stroke="#3a3f30"/>
  <text x="131" y="278" fill="#e8e5d8" font-size="14" text-anchor="middle">the book</text>
  <text x="131" y="298" fill="#a49c87" font-size="11.5" text-anchor="middle">Hall, 1928</text>

  <!-- branch stems -->
  <line x1="206" y1="281" x2="236" y2="281" stroke="#a49c87" stroke-width="2"/>
  <line x1="236" y1="120" x2="236" y2="440" stroke="#2c2e24" stroke-width="2"/>

  <!-- ROW 1: believe (error) -->
  <line x1="236" y1="128" x2="300" y2="128" stroke="#d65a48" stroke-width="2.5" marker-end="url(#rh)"/>
  <text x="246" y="118" fill="#d65a48" font-size="12">believe it</text>
  <rect x="306" y="102" width="188" height="52" rx="6" fill="#161b15" stroke="#3a3f30"/>
  <text x="400" y="126" fill="#e8e5d8" font-size="12.5" text-anchor="middle">accept uncritically</text>
  <text x="400" y="143" fill="#a49c87" font-size="11" text-anchor="middle">skip the work</text>
  <line x1="494" y1="128" x2="560" y2="128" stroke="#d65a48" stroke-width="2.5" marker-end="url(#rh)"/>
  <rect x="566" y="100" width="372" height="56" rx="6" fill="#2a1512" stroke="#d65a48"/>
  <text x="586" y="124" fill="#f0b9ac" font-size="13">&#10007; &#8220;recovered ancient science&#8221;</text>
  <text x="586" y="143" fill="#a49c87" font-size="11.5">credulous &#8212; takes the lineage claim at its word</text>

  <!-- ROW 2: govern (the earned reading) -->
  <line x1="236" y1="281" x2="296" y2="281" stroke="#86efac" stroke-width="2.5" marker-end="url(#gh)"/>
  <text x="246" y="271" fill="#86efac" font-size="12">govern it</text>
  <g>
    <rect x="300" y="256" width="78" height="50" rx="6" fill="#111c15" stroke="#2f5d3e"/>
    <text x="339" y="286" fill="#cfe9d6" font-size="11.5" text-anchor="middle">draft</text>
    <line x1="378" y1="281" x2="396" y2="281" stroke="#86efac" stroke-width="2" marker-end="url(#gh)"/>
    <rect x="398" y="256" width="78" height="50" rx="6" fill="#111c15" stroke="#2f5d3e"/>
    <text x="437" y="286" fill="#cfe9d6" font-size="11.5" text-anchor="middle">audit</text>
    <line x1="476" y1="281" x2="494" y2="281" stroke="#86efac" stroke-width="2" marker-end="url(#gh)"/>
    <rect x="496" y="256" width="92" height="50" rx="6" fill="#111c15" stroke="#2f5d3e"/>
    <text x="542" y="286" fill="#cfe9d6" font-size="11.5" text-anchor="middle">calibrate</text>
  </g>
  <line x1="588" y1="281" x2="606" y2="281" stroke="#86efac" stroke-width="2.5" marker-end="url(#gh)"/>
  <rect x="610" y="246" width="328" height="72" rx="6" fill="#10211a" stroke="#86efac"/>
  <text x="628" y="272" fill="#cdeedd" font-size="13">&#10003; a compendium of compressions</text>
  <text x="628" y="292" fill="#a49c87" font-size="11.5">reliable about its self-image,</text>
  <text x="628" y="309" fill="#a49c87" font-size="11.5">unreliable as history &#8212; each claim rated</text>

  <!-- ROW 3: dismiss (error) -->
  <line x1="236" y1="434" x2="300" y2="434" stroke="#d65a48" stroke-width="2.5" marker-end="url(#rh)"/>
  <text x="246" y="424" fill="#d65a48" font-size="12">dismiss it</text>
  <rect x="306" y="408" width="188" height="52" rx="6" fill="#161b15" stroke="#3a3f30"/>
  <text x="400" y="432" fill="#e8e5d8" font-size="12.5" text-anchor="middle">reject uncritically</text>
  <text x="400" y="449" fill="#a49c87" font-size="11" text-anchor="middle">also skip the work</text>
  <line x1="494" y1="434" x2="560" y2="434" stroke="#d65a48" stroke-width="2.5" marker-end="url(#rh)"/>
  <rect x="566" y="406" width="372" height="56" rx="6" fill="#2a1512" stroke="#d65a48"/>
  <text x="586" y="430" fill="#f0b9ac" font-size="13">&#10007; &#8220;occult nonsense&#8221;</text>
  <text x="586" y="449" fill="#a49c87" font-size="11.5">dismissive &#8212; throws out the compendium too</text>

  <text x="56" y="520" fill="#a49c87" font-size="12">Both easy readings share the same flaw: they skip the examination. The governed path is the only one</text>
  <text x="56" y="538" fill="#a49c87" font-size="12">that earns its verdict &#8212; and it is the only one that keeps what is valuable while naming what is false.</text>
</svg>
