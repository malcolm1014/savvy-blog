<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">
  <rect width="1000" height="540" fill="#0d1410"/>
  <rect x="0.5" y="0.5" width="999" height="539" fill="none" stroke="#2c2e24"/>

  <text x="56" y="52" fill="#e0a256" font-size="15" font-weight="700" letter-spacing="1.2">THE DATING GAP THE WHOLE CLAIM RESTS ON</text>
  <text x="56" y="74" fill="#a49c87" font-size="12.5">Where the Hermetic texts were *said* to sit in time, versus where philology actually places them.</text>

  <!-- timeline axis: map years to x. Domain -3000 BCE .. 2000 CE over x 90..940 -->
  <!-- helper ticks -->
  <line x1="90" y1="300" x2="940" y2="300" stroke="#3a3f30" stroke-width="2"/>
  <!-- tick marks: -3000,-2000,-1000,0,1000,2000 -->
  <!-- x(y) = 90 + (y+3000)/5000*850 -->
  <g fill="#7d7363" font-size="11" text-anchor="middle">
    <line x1="90"  y1="296" x2="90"  y2="304" stroke="#3a3f30"/><text x="90" y="322">3000 BCE</text>
    <line x1="260" y1="296" x2="260" y2="304" stroke="#3a3f30"/><text x="260" y="322">2000 BCE</text>
    <line x1="430" y1="296" x2="430" y2="304" stroke="#3a3f30"/><text x="430" y="322">1000 BCE</text>
    <line x1="600" y1="296" x2="600" y2="304" stroke="#3a3f30"/><text x="600" y="322">0</text>
    <line x1="770" y1="296" x2="770" y2="304" stroke="#3a3f30"/><text x="770" y="322">1000 CE</text>
    <line x1="940" y1="296" x2="940" y2="304" stroke="#3a3f30"/><text x="940" y="322">2000 CE</text>
  </g>

  <!-- CLAIMED band: "primordial Egypt, before Moses" ~ -2500..-1200, gold, dashed/ghostly -->
  <rect x="175" y="170" width="235" height="54" rx="5" fill="#2a2213" stroke="#e0a256" stroke-dasharray="5 4"/>
  <text x="292" y="150" fill="#e0a256" font-size="12.5" text-anchor="middle" font-weight="700">THE CLAIM</text>
  <text x="292" y="194" fill="#edc187" font-size="11.5" text-anchor="middle">&#8220;primordial Egyptian wisdom,</text>
  <text x="292" y="211" fill="#edc187" font-size="11.5" text-anchor="middle">older than Moses&#8221;</text>
  <!-- ghost arrow from claim down to where it was imagined -->
  <line x1="292" y1="224" x2="292" y2="292" stroke="#e0a256" stroke-width="1.3" stroke-dasharray="3 4"/>

  <!-- ACTUAL band: 100-300 CE, green, solid. x(100CE)=90+(100+3000)/5000*850=90+527=617 ; x(300CE)=90+(300+3000)/5000*850=90+561=651 -->
  <rect x="612" y="356" width="46" height="40" rx="4" fill="#10211a" stroke="#86efac"/>
  <line x1="635" y1="300" x2="635" y2="356" stroke="#86efac" stroke-width="2"/>
  <circle cx="635" cy="300" r="5" fill="#86efac"/>
  <text x="635" y="430" fill="#86efac" font-size="12.5" text-anchor="middle" font-weight="700">THE FACT</text>
  <text x="635" y="450" fill="#cdeedd" font-size="11.5" text-anchor="middle">Corpus Hermeticum</text>
  <text x="635" y="467" fill="#a49c87" font-size="11" text-anchor="middle">composed c. 100&#8211;300 CE</text>
  <text x="635" y="483" fill="#7d7363" font-size="10" text-anchor="middle">(Copenhaver 1992; Bull 2018)</text>

  <!-- Ficino translation 1463: x=90+(1463+3000)/5000*850=90+758=848 -->
  <circle cx="848" cy="300" r="4" fill="#7fa6c2"/>
  <line x1="848" y1="300" x2="848" y2="250" stroke="#7fa6c2" stroke-width="1.3"/>
  <text x="848" y="243" fill="#7fa6c2" font-size="10.5" text-anchor="middle">1463</text>
  <text x="848" y="230" fill="#8c8575" font-size="9.5" text-anchor="middle">Ficino translates,</text>
  <text x="848" y="219" fill="#8c8575" font-size="9.5" text-anchor="middle">revival begins</text>

  <!-- Casaubon 1614: x=90+(1614+3000)/5000*850=90+784=874 -->
  <circle cx="874" cy="300" r="5" fill="#f08c7a"/>
  <line x1="874" y1="300" x2="874" y2="366" stroke="#f08c7a" stroke-width="1.5"/>
  <text x="874" y="384" fill="#f08c7a" font-size="10.5" text-anchor="middle">1614</text>
  <text x="898" y="400" fill="#c9897c" font-size="9.5" text-anchor="middle">Casaubon</text>
  <text x="900" y="413" fill="#8c8575" font-size="9.5" text-anchor="middle">redates on</text>
  <text x="900" y="425" fill="#8c8575" font-size="9.5" text-anchor="middle">vocabulary</text>

  <!-- the gap arrow between claim and fact -->
  <path d="M 360 197 C 520 180, 540 300, 628 300" fill="none" stroke="#7d7363" stroke-width="1.4" stroke-dasharray="2 5"/>
  <text x="430" y="250" fill="#a49c87" font-size="11" font-style="italic">the gap: &#8776; 1,500&#8211;2,800 years</text>

  <text x="56" y="516" fill="#a49c87" font-size="11.5">Ficino assumed the texts were primordial; Casaubon&#8217;s philology collapsed the claim two centuries later. Modern dating confirms him.</text>
</svg>
